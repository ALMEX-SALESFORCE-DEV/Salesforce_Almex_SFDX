<template>

    <section class="activities-panel">

        <div class="activities-table-header">

            <div class="activities-table-heading-block">

                <div class="activities-table-heading">

                    <div class="activities-table-heading-icon">
                        <lightning-icon icon-name="utility:table" alternative-text="Tabla de actividades" size="small"
                            variant="inverse">
                        </lightning-icon>
                    </div>

                    <div class="activities-table-heading-copy">

                        <h2>
                            Desglose de actividades
                        </h2>

                        <div class="activities-table-heading-subtitle">
                            <p>
                                Actividades registradas por los ejecutivos comerciales.
                            </p>

                            <template lwc:if={isAdvancedSearchSelected}>
                                <span class="demonstration-badge">
                                    Prueba demostrativa
                                </span>
                            </template>
                        </div>

                    </div>

                </div>

                <div class="breakdown-section-selector" role="tablist" aria-label="Vista del desglose de actividades">
                    <button type="button" class={consultationSectionButtonClass} data-section="consultation" role="tab"
                        aria-selected={isActivityConsultationSelected} onclick={handleBreakdownSectionSelect}>
                        Consulta de actividades
                    </button>

                    <button type="button" class={advancedSearchSectionButtonClass} data-section="advanced" role="tab"
                        aria-selected={isAdvancedSearchSelected} onclick={handleBreakdownSectionSelect}>
                        Tablero de cobertura de visitas de clientes
                    </button>
                </div>

            </div>

            <template lwc:if={isActivityConsultationSelected}>
                <div class="activities-table-header-actions">

                    <div class="activities-record-total">
                        <span>Total de registros</span>
                        <strong>{managementActivitiesCount}</strong>
                    </div>

                    <lightning-button label="Descargar Excel" icon-name="utility:download"
                        onclick={handleDownloadManagementExcel} disabled={isDownloadingManagementExcel}>
                    </lightning-button>

                </div>
            </template>

        </div>

        <template lwc:if={isActivityConsultationSelected}>

            <div class="table-filters">

                <!-- EJECUTIVOS -->
                <div class="table-filter table-filter-executives">
                    <label>Ejecutivo</label>

                    <details class="multi-select" ontoggle={handleTableFilterToggle} onclick={handleFilterMenuClick}>

                        <summary>
                            <span>{tableExecutiveFilterLabel}</span>

                            <lightning-icon icon-name="utility:chevrondown" size="xx-small" alternative-text="Abrir">
                            </lightning-icon>
                        </summary>

                        <div class="multi-select-options">
                            <template for:each={tableExecutiveOptions} for:item="executive">

                                <label class="multi-select-option" key={executive.id}>

                                    <input type="checkbox" name="executive" value={executive.name}
                                        checked={executive.selected} onchange={handleExecutiveTableFilterChange}>

                                    <span class="filter-executive-dot" style={executive.dotStyle}>
                                    </span>

                                    <span class="filter-executive-name">
                                        {executive.name}
                                    </span>

                                </label>
                            </template>
                        </div>
                    </details>
                </div>

                <!-- SUCURSAL / PROSPECTO -->
                <div class="table-filter management-party-filter" onclick={handleFilterMenuClick}>
                    <label for="management-party-filter">
                        Sucursal / Prospecto
                    </label>

                    <div class="management-party-type-selector" role="radiogroup" aria-label="Tipo de relación">

                        <label class="management-party-type-option">
                            <input type="radio" name="managementPartyType" value="branch"
                                checked={isManagementBranchTarget} onchange={handleManagementPartyTypeChange}>

                            <span>Sucursal</span>
                        </label>

                        <label class="management-party-type-option">
                            <input type="radio" name="managementPartyType" value="prospect"
                                checked={isManagementProspectTarget} onchange={handleManagementPartyTypeChange}>

                            <span>Prospecto</span>
                        </label>

                    </div>

                    <div class="filter-input-icon">
                        <lightning-icon icon-name="utility:search" size="xx-small" alternative-text="">
                        </lightning-icon>

                        <input id="management-party-filter" type="search" value={tableFilters.partySearch}
                            placeholder={managementPartySearchPlaceholder} autocomplete="off"
                            oninput={handleManagementPartySearch} onfocus={handleManagementPartyFocus}
                            onblur={handleManagementPartyBlur}>
                    </div>

                    <template lwc:if={showManagementPartyResults}>

                        <div class="management-party-results" role="listbox">

                            <template lwc:if={isSearchingManagementParties}>

                                <div class="management-party-feedback">
                                    <lightning-spinner alternative-text="Buscando coincidencias" size="small">
                                    </lightning-spinner>

                                    <span>Buscando coincidencias...</span>
                                </div>

                            </template>

                            <template lwc:else>

                                <template lwc:if={hasManagementPartyResults}>

                                    <template for:each={managementPartyResults} for:item="result">

                                        <button key={result.key} type="button" class="management-party-result"
                                            data-result-key={result.key} onclick={handleManagementPartySelect}
                                            role="option">

                                            <span class="management-party-result-icon">
                                                <lightning-icon icon-name={result.iconName} size="small"
                                                    alternative-text={result.typeLabel}>
                                                </lightning-icon>
                                            </span>

                                            <span class="management-party-result-copy">
                                                <strong>{result.name}</strong>
                                                <small>{result.secondary}</small>
                                            </span>

                                        </button>

                                    </template>

                                </template>

                                <template lwc:else>

                                    <div class="management-party-feedback">
                                        {managementPartyEmptyMessage}
                                    </div>

                                </template>

                            </template>

                        </div>

                    </template>
                </div>

                <!-- TIPO DE ACTIVIDAD -->
                <div class="table-filter">
                    <label>Tipo de actividad</label>

                    <details class="multi-select table-single-select" ontoggle={handleTableFilterToggle}
                        onclick={handleFilterMenuClick}>

                        <summary>
                            <span>{tableActivityTypeFilterLabel}</span>

                            <lightning-icon icon-name="utility:chevrondown" size="xx-small" alternative-text="Abrir">
                            </lightning-icon>
                        </summary>

                        <div class="multi-select-options">

                            <label class="multi-select-option">
                                <input type="radio" name="activityType" value="" checked={allActivityTypesSelected}
                                    onchange={handleTableFilterChange}>

                                <span>Todos los tipos</span>
                            </label>

                            <template for:each={tableActivityTypeOptions} for:item="activityType">

                                <label class="multi-select-option" key={activityType.id}>

                                    <input type="radio" name="activityType" value={activityType.label}
                                        checked={activityType.selected} onchange={handleTableFilterChange}>

                                    <span class="table-filter-activity-icon" style={activityType.iconStyle}>

                                        <lightning-icon icon-name={activityType.iconName} size="xx-small"
                                            variant="inverse" alternative-text={activityType.label}>
                                        </lightning-icon>

                                    </span>

                                    <span class="table-filter-option-label">
                                        {activityType.label}
                                    </span>

                                </label>
                            </template>

                        </div>
                    </details>
                </div>

                <!-- ESTADO -->
                <div class="table-filter">
                    <label for="state-filter">Estado</label>

                    <select id="state-filter" name="state" value={tableFilters.state}
                        onchange={handleTableFilterChange}>

                        <option value="" selected={allManagementStatesSelected}>
                            Todos los estados
                        </option>

                        <template for:each={tableStateOptions} for:item="state">

                            <option key={state.value} value={state.value} selected={state.selected}>
                                {state.label}
                            </option>

                        </template>
                    </select>
                </div>

                <!-- SEGUIMIENTO -->
                <div class="table-filter">
                    <label for="follow-up-filter">
                        Seguimiento
                    </label>

                    <select id="follow-up-filter" name="followUp" value={tableFilters.followUp}
                        onchange={handleTableFilterChange}>

                        <option value="">Todos</option>
                        <option value="true">Con seguimiento</option>
                        <option value="false">Sin seguimiento</option>
                    </select>
                </div>

                <!-- ESTATUS -->
                <div class="table-filter">
                    <label>Estatus</label>

                    <details class="multi-select table-single-select" ontoggle={handleTableFilterToggle}
                        onclick={handleFilterMenuClick}>

                        <summary>
                            <span>{tableStatusFilterLabel}</span>

                            <lightning-icon icon-name="utility:chevrondown" size="xx-small" alternative-text="Abrir">
                            </lightning-icon>
                        </summary>

                        <div class="multi-select-options">

                            <label class="multi-select-option">
                                <input type="radio" name="status" value="" checked={allStatusesSelected}
                                    onchange={handleTableFilterChange}>

                                <span>Todos los estatus</span>
                            </label>

                            <template for:each={tableStatusOptions} for:item="status">

                                <label class="multi-select-option" key={status.id}>

                                    <input type="radio" name="status" value={status.label} checked={status.selected}
                                        onchange={handleTableFilterChange}>

                                    <span style={status.pillStyle}>
                                        <span class="table-filter-status-symbol">
                                            {status.symbol}
                                        </span>

                                        <span>{status.label}</span>
                                    </span>

                                </label>
                            </template>

                        </div>
                    </details>
                </div>

                <!-- FECHA INICIAL -->
                <div class="table-filter">
                    <label for="date-from-filter">De</label>

                    <input id="date-from-filter" name="dateFrom" type="date" value={tableFilters.dateFrom}
                        onchange={handleTableDateChange}>
                </div>

                <!-- FECHA FINAL -->
                <div class="table-filter">
                    <label for="date-to-filter">A</label>
                    <input id="date-to-filter" name="dateTo" type="date" value={tableFilters.dateTo}
                        disabled={isDateToDisabled} onchange={handleTableDateChange}>
                </div>

                <!-- ACCIONES -->
                <div class="table-filter-actions">
                    <button type="button" class="table-filter-clear" onclick={handleClearTableFilters}>
                        Limpiar
                    </button>

                    <button type="button" class="table-filter-apply" onclick={handleApplyTableDateRange}>
                        Consultar periodo
                    </button>
                </div>

            </div>

            <div class="activities-table-container">

                <template lwc:if={isLoadingManagementActivities}>

                    <div class="activities-loading">
                        <lightning-spinner alternative-text="Cargando actividades" size="medium">
                        </lightning-spinner>
                    </div>

                </template>

                <template lwc:else>

                    <template lwc:if={hasManagementActivities}>

                        <c-activity-breakdown-datatable key-field="id" data={managementActivities}
                            columns={managementColumns} sorted-by={managementSortBy}
                            sorted-direction={managementSortDirection} row-number-offset={managementRowNumberOffset}
                            onsort={handleManagementSort} hide-checkbox-column show-row-number-column
                            column-widths-mode="auto">
                        </c-activity-breakdown-datatable>

                    </template>

                    <template lwc:else>

                        <div class="activities-empty">

                            <lightning-icon icon-name="utility:table" size="medium" alternative-text="Sin actividades">

                                No existen actividades registradas
                            </h3>

                            <p>
                                Los registros aparecerán aquí cuando los
                                ejecutivos agreguen actividades.
                            </p>

                        </div>

                    </template>

                </template>

            </div>

            <!-- PAGINACIÓN: FUERA DEL CONTENEDOR DE LA TABLA -->
            <template lwc:if={hasManagementServerResults}>

                    <span class="table-pagination-summary">
                        {managementPageSummary}
                    </span>

                    <div class="table-pagination-navigation">

                        <button type="button" class="table-pagination-button" disabled={isManagementPreviousDisabled}

                            <lightning-icon icon-name="utility:chevronleft" size="xx-small" alternative-text="Anterior">

                            Anterior
                        </button>

                        <span class="table-pagination-page">
                            {managementPageLabel}
                        </span>

                        <button type="button" class="table-pagination-button" disabled={isManagementNextDisabled}
                            onclick={handleManagementNextPage}>

                            Siguiente

                            <lightning-icon icon-name="utility:chevronright" size="xx-small"
                                alternative-text="Siguiente">
                            </lightning-icon>

                        </button>

                    </div>

                </div>

            </template>

        </template>

                        <button type="button" class="advanced-search-generate">

                    <div class="advanced-search-conditions">
                        <button type="button" class="advanced-search-chip">
                            Estado: Todos <span>⌄</span>
                        </button>
                        <button type="button" class="advanced-search-chip">
                            Cliente: Todos <span>⌄</span>
                        </button>
                        <button type="button" class="advanced-search-chip advanced-search-chip-filter">
                            Solo visitas completadas <span>×</span>
                        </button>
                        <button type="button" class="advanced-search-add-condition">
                            <span>＋</span> Agregar condición

                            <div class="advanced-search-panel-title">
                                <span class="advanced-search-panel-icon">◌</span>
                                <div>
                                    <h3>Cobertura comercial por ejecutivo y cliente</h3>
                                    <p>Porcentaje de cartera atendida en el periodo seleccionado.</p>
                                </div>
                            </div>
                        </div>

                        <div class="advanced-search-coverage-table-wrap">

                                        <th scope="col">Miguel Santos <span>⌄</span></th>
                                        <th scope="col">Sofía Herrera <span>⌄</span></th>
                                        <th scope="col">Total <span>⌄</span></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <th scope="row">BIMBO</th>
                                        <td class="coverage-high">92%</td>
                                        <td class="coverage-medium">67%</td>
                                        <td class="coverage-low">34%</td>
                                        <td class="coverage-high">88%</td>
                                        <td class="coverage-high">76%</td>
                                        <td class="coverage-total">71%</td>
                                    </tr>
                                    <tr>
                                        <th scope="row">COCA COLA FEMSA</th>
                                        <td class="coverage-high">85%</td>

                                    <tr>

                                        <td class="coverage-medium">68%</td>

                                    <tr>

                                    </tr>

                                        <td class="coverage-total">81%</td>
                                    </tr>

                                    </tr>
                                    <tr>
                                        <th scope="row">SABRITAS</th>
                                        <td class="coverage-medium">72%</td>

                        <div class="advanced-search-legend">
                            <span><i class="legend-dot legend-high"></i><strong>Cobertura ≥ 80%</strong><small>En rango
                                    objetivo</small></span>
                            <span><i class="legend-dot legend-medium"></i><strong>Cobertura 50% -
                                    79%</strong><small>Requiere atención</small></span>
                            <span><i class="legend-dot legend-low"></i><strong>Cobertura &lt; 50%</strong><small>Riesgo

                        </div>

                    <aside class="advanced-search-insights" aria-label="Resumen ejecutivo">
                        <div class="advanced-search-insights-heading">

                                    <td>Laura Méndez</td>

                                </tr>
                                <tr>
