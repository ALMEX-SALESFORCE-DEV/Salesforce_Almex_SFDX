<template>

    <div class="agenda-component">

        <div class="agenda-tabs">

            <nav class="agenda-tab-list" role="tablist" aria-label="Secciones de Agendas">

                <button type="button" class={calendarTabClass} role="tab" data-tab="calendar"
                    aria-selected={isCalendarTabSelected} aria-controls="calendar-panel" onclick={handleTabSelect}
                    onkeydown={handleTabKeydown}>
                    <lightning-icon class="agenda-tab-icon" icon-name="utility:event" size="small"
                        alternative-text=""></lightning-icon>
                    <span>Calendario</span>
                </button>

                <template lwc:if={canViewActivityBreakdown}>
                    <button type="button" class={activityBreakdownTabClass} role="tab" data-tab="activities"
                        aria-selected={isActivityBreakdownTabSelected} aria-controls="activities-panel"
                        onclick={handleTabSelect} onkeydown={handleTabKeydown}>
                        <lightning-icon class="agenda-tab-icon" icon-name="utility:table" size="small"
                            alternative-text=""></lightning-icon>
                        <span>Desglose de actividades</span>
                    </button>
                </template>

                <button type="button" class={visitLogTabClass} role="tab" data-tab="suggestions"
                    aria-selected={isVisitLogTabSelected} aria-controls="suggestions-panel" onclick={handleTabSelect}
                    onkeydown={handleTabKeydown}>
                    <lightning-icon class="agenda-tab-icon" icon-name="utility:knowledge_base" size="small"
                        alternative-text=""></lightning-icon>
                    <span>Bitácora de visitas y sugerencias</span>
                </button>

            </nav>

            <section id="calendar-panel" class="agenda-tab-panel" role="tabpanel" aria-label="Calendario"
                hidden={isCalendarPanelHidden}>
                <c-agenda-calendar onmonthchange={handleCalendarMonthChange}>
                </c-agenda-calendar>
            </section>

            <template lwc:if={activityBreakdownInitialized}>
                <section id="activities-panel" class="agenda-tab-panel" role="tabpanel"
                    aria-label="Desglose de actividades" hidden={isActivityBreakdownPanelHidden}>
                    <c-agenda-activity-breakdown month-date={calendarMonthDate}
                        refresh-token={activityBreakdownRefreshToken}>
                    </c-agenda-activity-breakdown>
                </section>
            </template>

            <template lwc:if={visitLogInitialized}>
                <section id="suggestions-panel" class="agenda-tab-panel" role="tabpanel"
                    aria-label="Bitácora de visitas y sugerencias" hidden={isVisitLogPanelHidden}>
                    <c-visit-log refresh-token={visitLogRefreshToken}>
                    </c-visit-log>
                </section>
            </template>

        </div>

    </div>

</template>
