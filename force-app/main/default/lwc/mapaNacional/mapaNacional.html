<template>
    <div class="dashboard">

        <template lwc:if={dataLoadError}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                <span class="slds-assistive-text">Error</span>
                <lightning-icon
                    icon-name="utility:error"
                    alternative-text="Error"
                    size="x-small"
                    variant="inverse"
                    class="slds-m-right_x-small">
                </lightning-icon>
                <h2>No fue posible cargar los precios: {dataLoadError}</h2>
            </div>
        </template>

        <!-- ==================== TOP CARDS ==================== -->
        <div class="stats-grid">

            <div class="stat-card stat-card-products">
                <div class="stat-icon stat-icon-products">
                    <lightning-icon icon-name="utility:apps" size="small" alternative-text="Productos monitoreados">
                    </lightning-icon>
                </div>

                <div class="stat-content">
                    <span class="stat-title" title="Productos distintos disponibles según los filtros de proveedor y periodo. No es el número de registros del producto seleccionado.">Productos Monitoreados</span>
                    <span class="stat-value">{monitoredProducts}</span>
                </div>
            </div>


            <div class="stat-card stat-card-states">
                <div class="stat-icon stat-icon-states">
                    <lightning-icon icon-name="utility:world" size="small" alternative-text="Estados analizados">
                    </lightning-icon>
                </div>

                <div class="stat-content">
                    <div class="stat-title-row">
                        <span class="stat-title">Estados Analizados</span>
                        <template lwc:if={hasActiveProviderSelection}>
                            <span class="provider-context-separator">—</span>
                            <template for:each={selectedProviderBadges} for:item="provider">
                                <span key={provider.name} class="provider-context-badge" style={provider.style}>
                                    ({provider.name})
                                </span>
                            </template>
                        </template>
                    </div>
                    <span class="stat-value">{analyzedStates}</span>
                </div>
            </div>


            <div class="stat-card stat-card-price">
                <div class="stat-icon stat-icon-price">
                    <lightning-icon icon-name="utility:money" size="small" alternative-text="Precio promedio">
                    </lightning-icon>
                </div>

                <div class="stat-content">
                    <div class="stat-title-row">
                        <span class="stat-title" title="Promedio anual: primero se convierte a USD/Ton y se multiplican por 12 los valores de registros mensuales; los anuales se conservan.">{averagePriceTitle}</span>
                        <template lwc:if={hasActiveProviderSelection}>
                            <span class="provider-context-separator">—</span>
                            <template for:each={selectedProviderBadges} for:item="provider">
                                <span key={provider.name} class="provider-context-badge" style={provider.style}>
                                    ({provider.name})
                                </span>
                            </template>
                        </template>
                    </div>
                    <span class="stat-value">{averagePriceDisplay}</span>
                    <span class="stat-meta">{currentPriceUnitLabel}</span>
                </div>
            </div>


            <div class="stat-card stat-card-alert">
                <div class="stat-icon stat-icon-alert">
                    <lightning-icon icon-name="utility:warning" size="small" alternative-text="Estados sin información">
                    </lightning-icon>
                </div>

                <div class="stat-content">
                    <span class="stat-title">Estados sin información</span>
                    <span class="stat-value">{outOfRangeStates}</span>
                </div>
            </div>

        </div>


        <!-- ==================== FILTERS ==================== -->
        <div class="filters">

            <div class="filter-context">
                <span class="filter-caption">Vista actual</span>
                <span class="scope-pill">
                    <lightning-icon icon-name="utility:world" size="xx-small" alternative-text="Estados"></lightning-icon>
                    Estados
                </span>
            </div>

            <div class="product-filter">
                <label for="product">Producto</label>

                <select id="product" class="product-select" onchange={handleProductChange}>
                    <option value="Azúcar">Azúcar</option>
                    <option value="Almidón">Almidón</option>
                    <option value="Glucosa 43">Glucosa 43</option>
                    <option value="Glucosa 44">Glucosa 44</option>
                    <option value="Glucosa 63">Glucosa 63</option>
                    <option value="Glucosa alta en maltosa">Glucosa alta en maltosa</option>
                    <option value="Fructosa 42">Fructosa 42</option>
                    <option value="Fructosa 55">Fructosa 55</option>
                    <option value="Fructosa cristalina 99">Fructosa cristalina 99</option>
                    <option value="Dextrosa monohidratada">Dextrosa monohidratada</option>
                    <option value="KRYSTAR líquido">KRYSTAR líquido</option>
                    <option value="Dextrosa 95% líquida">Dextrosa 95% líquida</option>
                </select>
            </div>

            <div class="period-filter">
                <label for="period-year">Año</label>
                <select id="period-year" name="periodFilterYear" class="product-select period-select" onchange={handlePeriodChange}
                    title="Filtra por el Año capturado en el registro de mapeo, sin usar las fechas del contrato.">
                    <template for:each={periodYearOptions} for:item="option">
                        <option key={option.value} value={option.value}>{option.label}</option>
                    </template>
                </select>
            </div>
            <div class="period-filter map-provider-filter">
                <label for="map-provider">Proveedor</label>
                <select id="map-provider" name="providerFilter" class="product-select" onchange={handleProviderChange}>
                    <template for:each={providerOptions} for:item="option">
                        <option key={option.value} value={option.value}>{option.label}</option>
                    </template>
                </select>
            </div>
            <template lwc:if={hasActiveProviderSelection}>
                <button type="button" class="period-clear provider-clear" onclick={clearProviderFilter}>
                    <lightning-icon icon-name="utility:clear" size="xx-small"></lightning-icon>Limpiar proveedor
                </button>
            </template>
            <template lwc:if={hasPeriodFilter}>
                <button type="button" class="period-clear" onclick={clearPeriodFilters}>
                    <lightning-icon icon-name="utility:clear" size="xx-small"></lightning-icon>
                    Limpiar periodo
                </button>
            </template>


            <div class="filter-summary" aria-live="polite">
                <span>Vista {consumptionPeriodLabel} ·</span>
                <span>Visualizando precios en</span>
                <strong>{currentPriceUnitLabel}</strong>
            </div>

        </div>

        <div class="exchange-rate-context" aria-live="polite">{exchangeRateLabel}</div>
        <template lwc:if={priceDataWarning}>
            <div class="period-data-warning" role="status">{priceDataWarning}</div>
        </template>
        <template lwc:if={exchangeRateError}>
            <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">{exchangeRateError}</div>
        </template>


        <!-- ==================== TABSET PRINCIPAL ==================== -->
        <lightning-tabset class="workspace-tabs" variant="scoped">

            <!-- ==================== TAB: MAPA Y RESÚMENES ==================== -->
            <lightning-tab label="Mapa y tablas" value="mapa">

                <div class="main-grid">

                    <!-- ==================== MAPA ==================== -->
                    <section class="panel map-panel">

                        <div class="panel-heading">
                            <div>
                                <div class="panel-title">Mapa de Competitividad</div>
                                <div class="panel-subtitle">{mapSubtitle}</div>
                            </div>
                            <div class="panel-badges">
                                <span class="currency-chip">{currentPriceUnitLabel}</span>
                            </div>
                        </div>

                        <div class="map-content">

                            <div class="map-container" lwc:dom="manual">
                            </div>

                        </div>

                    </section>

                    <section class="panel summary-panel">

                        <div class="summary-header">

                            <div class="panel-heading-copy">
                                <div class="heading-title-row">
                                    <div class="panel-title">Resumen Estatal</div>
                                    <span class="count-badge">{summaryRowCount} estados</span>
                                </div>
                                <div class="panel-subtitle">Comparativo comercial por entidad federativa · {summaryContextLabel}</div>
                            </div>

                            <div class="summary-actions">
                                <lightning-button
                                    label="Descargar Excel"
                                    icon-name="utility:download"
                                    onclick={handleDownloadExcel}
                                    disabled={isDownloading}>
                                </lightning-button>
                            </div>

                        </div>

                        <!-- RESUMEN ESTATAL -->
                        <div
                            class="table-wrapper summary-state-table datatable-scroll"
                            tabindex="-1"
                            ondblclick={handleStateTableDoubleClick}>

                            <lightning-datatable
                                class="market-datatable" style={summaryTableStyle} data-table="state" onresize={handleTableResize}
                                key-field="id"
                                data={summaryTableData}
                                columns={summaryTableColumns}
                                selected-rows={selectedStateRowIds}
                                column-widths-mode="fixed"
                                wrap-text-max-lines="2"
                                onrowselection={handleStateSelection}>
                            </lightning-datatable>

                        </div>

                        <div class="section-heading">
                            <div>
                                <div class="heading-title-row">
                                    <div class="panel-title">Desglose por ciudad</div>
                                    <span class="count-badge">{cityRowCount} registros</span>
                                </div>
                                <div class="panel-subtitle" title="Las casillas del resumen estatal limitan este desglose y el Excel; no cambian los indicadores generales.">{cityContextLabel}</div>
                            </div>
                        </div>

                        <!-- RESUMEN CIUDADES -->
                        <div
                            class="table-wrapper summary-city-table datatable-scroll"
                            tabindex="-1"
                            ondblclick={handleCityTableDoubleClick}>

                            <lightning-datatable
                                class="market-datatable" style={cityTableStyle} data-table="city" onresize={handleTableResize}
                                key-field="id"
                                data={cityTableData}
                                columns={cityTableColumns}
                                column-widths-mode="fixed"
                                wrap-text-max-lines="2"
                                hide-checkbox-column>
                            </lightning-datatable>

                        </div>

                    </section>

                </div>

            </lightning-tab>


            <lightning-tab label="Historial de propuestas" value="historial">
                <section class="panel history-panel">
                    <div class="panel-heading">
                        <div>
                            <div class="panel-title">Historial de propuestas</div>
                            <div class="panel-subtitle">{historyContextLabel}</div>
                        </div>
                        <div class="history-filters">
                            <div class="history-product-context">
                                <span class="filter-caption">Producto seleccionado</span>
                                <span class="history-product-badge">{selectedProduct}</span>
                            </div>
                            <div class="period-filter history-provider-filter">
                                <label for="history-provider">Proveedor del historial</label>
                                <select id="history-provider" name="historyProvider" class="product-select"
                                    onchange={handleHistoryProviderChange}>
                                    <template for:each={historyProviderOptions} for:item="option">
                                        <option key={option.value} value={option.value}>{option.label}</option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="history-table datatable-scroll">
                        <lightning-datatable class="market-datatable" style={historyTableStyle} data-table="history" onresize={handleTableResize}
                            key-field="id" data={historyTableData} columns={historyTableColumns}
                            column-widths-mode="fixed" wrap-text-max-lines="2" hide-checkbox-column></lightning-datatable>
                    </div>
                </section>
            </lightning-tab>

            <!-- ==================== TAB: GRÁFICAS ==================== -->

            <lightning-tab label="Gráficas" value="graficas" onactive={handleChartsTabActive}>

                <section class="panel charts-panel">

                    <div class="charts-header">
                        <div>
                            <div class="panel-title">Tendencia de precios</div>
                            <div class="panel-subtitle">Serie por año del periodo comercial · {currentPriceUnitLabel}</div>
                        </div>

                    </div>

                    <div class="chart-wrapper">

                        <div class="trend-chart" lwc:dom="manual">
                        </div>

                    </div>

                </section>

            </lightning-tab>

        </lightning-tabset>
    </div>
    <template if:true={isTableExpanded}>

        <div class="table-modal-backdrop" onclick={closeExpandedTable}>
        </div>
        <section class="table-expanded" role="dialog" aria-modal="true" aria-labelledby="expanded-table-title"
            onkeydown={handleExpandedKeyDown}>
            <header class="table-expanded-header">
                <div>
                    <h2 id="expanded-table-title">{expandedTableTitle}</h2>
                    <p>{expandedTableContext}</p>
                </div>
                <div class="table-expanded-actions">
                    <button type="button" class="reset-column-widths" onclick={resetExpandedColumnWidths}>Restablecer columnas</button>
                    <button type="button" class="close-expanded-table" onclick={closeExpandedTable} title="Cerrar" aria-label="Cerrar tabla ampliada">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Cerrar"></lightning-icon>
                    </button>
                </div>
            </header>
            <!-- Un solo propietario del desplazamiento: sin otro datatable/scroll dentro. -->
            <div class="table-expanded-content" tabindex="0" role="region" aria-label="Tabla ampliada desplazable">
                <table class="expanded-native-table" style={expandedTableStyle} aria-label={expandedTableTitle}>
                    <colgroup>
                        <template for:each={expandedTableColumns} for:item="column">
                            <col key={column.fieldName} style={column.style}>
                        </template>
                    </colgroup>
                    <thead>
                        <tr>
                            <template for:each={expandedTableColumns} for:item="column">
                                <th key={column.fieldName} scope="col">
                                    <span class="expanded-column-label">{column.label}</span>
                                    <span class="expanded-column-resizer" role="separator" tabindex="0" aria-orientation="vertical"
                                        aria-label={column.resizeLabel} aria-valuemin="90" aria-valuemax="1000" aria-valuenow={column.width}
                                        title={column.resizeLabel} data-field={column.fieldName}
                                        onpointerdown={handleExpandedResizeStart} onpointermove={handleExpandedResizeMove}
                                        onpointerup={handleExpandedResizeEnd} onpointercancel={handleExpandedResizeEnd}
                                        onlostpointercapture={handleExpandedResizeEnd} onkeydown={handleExpandedResizeKey}>
                                    </span>
                                </th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={expandedTableRows} for:item="row">
                            <tr key={row.id}>
                                <template for:each={row.cells} for:item="cell">
                                    <td key={cell.key} class={cell.className} title={cell.text}>{cell.text}</td>
                                </template>
                            </tr>
                        </template>
                        <template lwc:if={expandedTableEmpty}>
                            <tr><td class="expanded-table-empty" colspan={expandedColumnCount}>No hay registros para los filtros seleccionados.</td></tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </section>
    </template>
</template>
