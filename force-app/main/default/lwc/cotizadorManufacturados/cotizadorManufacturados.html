<template>
	<template if:false={link}>
		<main if:true={opp}>
			<h1>Cotizador Manufacturados</h1>
			<section class="grid col-1-auto gap-1">
				<div class="grid row-1-auto gap-05">
					<div class="grid col-2 gap-1">
						<div class="flex flex-col gap-05">
							<!-- value={i.productId} onchange={onChangeRecordPicker} -->
							<label
								for="nombre-del-producto"
								class="grid"
								style="grid-template-columns: 150px auto"
							>
								Producto:
								<lightning-record-picker
									id="nombre-del-producto"
									label="Producto"
									placeholder="Nombre del producto"
									object-api-name="Product2"
									variant="label-hidden"
									data-type="product"
									class="label-input"
									value={opp.Producto__c}
									disabled
								>
								</lightning-record-picker>
							</label>
							<!-- <label for="código-del-producto" class="grid col-1-auto">
							Código del producto
							<input type="text" class="input" placeholder="Codigo del producto" id="código-del-producto" />
						</label> -->
							<label
								for="customer-name"
								class="grid"
								style="grid-template-columns: 150px auto"
							>
								Customer Name:
								<input
									type="text"
									placeholder="Customer Name"
									id="customer-name"
									value={opp.Account.Name}
									disabled
								/>
							</label>
							<label
								for="oracle-customer-number"
								class="grid"
								style="grid-template-columns: 150px auto"
							>
								Oracle Customer Number:
								<input
									type="text"
									placeholder="Oracle Customer Number"
									id="oracle-customer-number"
									value={opp.Account.N_mero_de_cuenta__c}
									disabled
								/>
							</label>
							<!--
								<label for="oracle-customer-name-customer-master" class="grid col-1-auto">
								Oracle Customer Name (Customer Master)
									<input
										type="text"
										placeholder="Oracle Customer Name (Customer Master)"
										id="oracle-customer-name-customer-master"
									/>
								</label>
							-->
						</div>
						<div>
							<p class="grid col-1-auto items-center">
								Agrement - Starting date:
								<input
									type="date"
									oninput={onChangeDate}
									value={agreementDate.init}
									name="initDate"
								/>
							</p>
							<p class="grid col-1-auto items-center">
								Agreement - Expiring date:
								<input
									type="date"
									oninput={onChangeDate}
									value={agreementDate.end}
									name="endDate"
								/>
							</p>
						</div>
					</div>
					<div class="grid col-1-auto gap-1">
						<div>
							<p class="grid col-2 items-center">
								Calendar Year Period:
								<span class="dotted-box justify-center"
									>{rangeDates.yearRange}</span
								>
							</p>
							<p class="grid col-2 items-center">
								Period:
								<span class="dotted-box justify-center"
									>{rangeDates.monthRange}</span
								>
							</p>
						</div>
						<div>
							<p class="grid col-1-auto items-center gap-1">
								Number of Months
								<span class="dotted-box justify-center" style="width: 50px"
									>{rangeDates.totalMonths}</span
								>
							</p>
							<p class="grid col-1-auto items-center gap-1">
								Currency
								<!-- <lightning-combobox
									name="currency"
									variant="label-hidden"
									placeholder="Seleccione una divisa"
									value={currency}
									options={currencyOptions}
									onchange={onChangeSelect}
								></lightning-combobox> -->
								<span class="dotted-box justify-center" style="width: 50px"
									>USD</span
								>
							</p>
							<!-- value={value}
								options={options}
								onchange={handleChange} -->
						</div>
					</div>
				</div>
				<div class="flex flex-col gap-05">
					<label for="quotation-date">
						Quotation Date
						<input
							placeholder="Quotation Date"
							type="text"
							id="quotation-date"
							value={quotationDate}
							readonly
						/>
					</label>
					<!-- <label for="agreement-date">
						Agreement Date <input placeholder="Agreement Date" type="text" id="agreement-date" />
					</label> -->
					<label for="invoice-selling-price">
						Terms - Invoicing Selling Price
						<select
							name="invoice-selling-price"
							id="invoice-selling-price"
							oninput={onChangeInvoiceSellingPrice}
							lwc:ref="invoiceSellingPrice"
							class="label-input"
						>
							<option value="customer-plant">Customer plant</option>
							<option value="almex-plant">Almex Plant</option>
						</select>
					</label>
					<label for="proposed-volume-mtons">
						Proposed Volume (Mtons)
						<input
							placeholder="Proposed Volume (Mtons)"
							type="number"
							onmousewheel={onInputWheel}
							id="proposed-volume-mtons"
							value={globalVolume.proposedMtons}
							name="proposedMtons"
							oninput={onChangeGlobalVolume}
							onfocus={onFocus}
							class="proposed-volume-mtons"
						/>
					</label>
					<label for="booked-volume-mtons">
						Booked Volume (Mtons)
						<input
							onfocus={onFocus}
							placeholder="Booked Volume (Mtons)"
							type="number"
							onmousewheel={onInputWheel}
							id="booked-volume-mtons"
							value={globalVolume.bookedMtons}
							name="bookedMtons"
							oninput={onChangeGlobalVolume}
						/>
					</label>
					<label for="delivery-points-number">
						Delivery Points Number
						<input
							placeholder="Delivery Points Number"
							type="number"
							onmousewheel={onInputWheel}
							id="delivery-points-number"
							value={globalVolume.pointsNumebr}
							name="pointsNumebr"
							oninput={onChangeGlobalVolume}
							onfocus={onFocus}
						/>
					</label>
					<div class={completeClass}>
						<span class="dotted-box justify-center check-label"
							>{checkCompleto}</span
						>
					</div>
					<button
						class="regular"
						onclick={saveQuote}
						disabled={checked}
						lwc:if={canSave}
					>
						Guardar
					</button>
				</div>
			</section>
			<div class="my-05">
				<h2 class="text-center bg-gray rounded">
					CRITICAL FILLOUT - SALES SUMMARY BY PLANT - FOR PRICING PURPOSES
				</h2>
			</div>
			<section>
				<div class="text-right mb-05">
					<button class="regular" onclick={onClickNewSite} type="button">
						Agregar Sucursal
					</button>
				</div>
				<table class="summary-table">
					<thead>
						<tr class="row-center">
							<th rowspan="2">Index</th>
							<!--col0:Index-->

							<th rowspan="2" style="width: 250px">Customer Site Name</th>
							<!--col01:Customer Site Name-->
							<th rowspan="2" style="width: 200px">Almacén</th>
							<!--col02:Almacén-->
							<th rowspan="2" style="width: 200px">Medio de transporte</th>
							<!--col03:Medio de transporte-->
							<th style="width: 100px">Volume</th>
							<!--col04:Volume 01-->
							<th style="width: 80px">Volume</th>
							<!--col05:Volume 02-->

							<th style="width: 70px">Costo</th>
							<!--col06:Costo-->
							<th style="width: 70px">Margin</th>
							<!--col07:Margin-->
							<th>LAB Almex</th>
							<!--col08:LAB Almex-->
							<th colspan="2">Freight</th>
							<!--col09:Freight-->
							<template lwc:if={fieldVisibility.summaryFinalFreight}>
								<th>Ajuste Flete</th>
								<!--col10:Ajuste Flete-->
								<th>Flete Final</th>
								<!--col11:Flete Final-->
							</template>
							<th>Lab Client</th>
							<!--col12:Lab Client-->
							<th rowspan="2">Acciones</th>
							<!--col13:Action-->
						</tr>

						<tr class="row-center">
							<th class="legend green">mt/year</th>
							<!--col04:Volume 01-->
							<th class="legend green">mt/embarque</th>
							<!--col05:Volume 02-->
							<th class="legend green">usd/mt</th>
							<!--col06:Costo-->
							<th class="legend green">usd/mt</th>
							<!--col07:Margin-->
							<th class="legend green">usd/mt</th>
							<!--col08:LAB Almex-->
							<th class="legend green" style="width: 100px">mxp/mt</th>
							<!--col09.1:Freight-->
							<th class="legend green" style="width: 100px">usd/mt</th>
							<!--col09.2:Freight-->
							<template lwc:if={fieldVisibility.summaryFinalFreight}>
								<th class="legend green">usd/mt</th>
								<!--col10:Ajuste Flete-->
								<th class="legend green">usd/mt</th>
								<!--col11:Flete Final-->
							</template>
							<th class="legend green">usd/mt</th>
							<!--col12:Lab Client-->
						</tr>
					</thead>
					<tbody>
						<template for:each={summaries} for:item="i">
							<tr class="row-center" key={i.id}>
								<td>{i.index}</td>
								<!--col0:Index-->
								<td>
									<lightning-record-picker
										label="Sucursales"
										placeholder="Sucursal"
										object-api-name="Sucursal__c"
										variant="label-hidden"
										data-type="customer-site"
										onchange={onChangeSite}
										value={i.customerSiteId}
										data-id={i.id}
										filter={filter}
										name="customerSiteId"
									>
									</lightning-record-picker>
								</td>
								<!--col01:Customer Site Name-->
								<td>
									<lightning-record-picker
										label="Almacén"
										placeholder="Almacén"
										object-api-name="Planta__c"
										variant="label-hidden"
										value={i.plantId}
										data-id={i.id}
										onchange={onChangeSite}
										name="plantId"
									>
										<!-- onchange={onChangePlant} -->
									</lightning-record-picker>
								</td>
								<!--col02:Almacén-->
								<!-- input-medio-transporte -->
								<td>
									<lightning-combobox
										class={i.id}
										data-column={i.id}
										data-id={i.id}
										name="transportation"
										variant="label-hidden"
										options={transportType}
										onchange={onChangeSite}
										value={i.transportation}
									></lightning-combobox>
								</td>
								<!--col03:Medio de transporte-->
								<td>
									<input
										type="number"
										onmousewheel={onInputWheel}
										placeholder="Volume"
										class="text-center"
										name="volume"
										value={i.volume}
										oninput={onChangeSummary}
										onfocus={onFocus}
										data-id={i.id}
									/>
								</td>
								<!--col04:Volume 01-->
								<td>
									<input
										type="number"
										onmousewheel={onInputWheel}
										min="1"
										placeholder="Volume"
										class="text-center"
										name="monthVolume"
										value={i.monthVolume}
										oninput={onChangeSummary}
										onfocus={onFocus}
										data-id={i.id}
									/>
								</td>
								<!--col05:Volume 02-->
								<td>{i.cost}</td>
								<!--col06:Costo-->
								<td>{i.margin}</td>
								<!--col07:Margin F -->
								<!-- Excel = I - G
								     CALCULO Margin (usd/mt): = Total Margin usd/mt del escenario
								     Definitivo (D) = currentLeftPrice.totalMarginUsdMt.value.
								     Se fija por fila en getInitSummary()/update() (igual para todas
								     las filas, viene del escenario, no por sucursal).
								     Para D: totalMarginUsdMt = exwUsd(D) - Total Cost, donde
								     exwUsd(D) = total ponderado de LAB Almex. -->
								<td>{i.labAlmex}</td>
								<!--col08:LAB Almex G -->
								<!-- Excel = L - K
									   CALCULO LAB Almex (usd/mt): = Lab Client (col12) - Freight usd/mt
								     (col09.2 usdMt). CustomerSiteClass.get labAlmex():
								     round(Number(labClient) - Number(usdMt), 3).
								     labClient es editable (override manual persistente); usdMt =
								     mxpMt / fxAverage. Al editar Lab Client, LAB Almex se recalcula. -->
								<td>
									<input
										type="number"
										onmousewheel={onInputWheel}
										placeholder="Mxp Mt"
										class="text-center"
										value={i.visibleMxpMt}
										oninput={onChangeSummary}
										readonly
									/>
								</td>
								<!--col09.1:Freight H -->
								<td>{i.usdMt}</td>
								<!--col09.1:Freight I -->
								<template lwc:if={fieldVisibility.summaryFinalFreight}>
									<td>
										<input
											type="number"
											onmousewheel={onInputWheel}
											placeholder="Volume"
											class="text-center"
											name="freightAddition"
											value={i.freightAddition}
											oninput={onChangeSummary}
											onfocus={onFocus}
											data-id={i.id}
										/>
									</td>
									<!--col10:Ajuste Flete J -->
									<td>{i.finalFreight}</td>
									<!--col11:Flete Final K -->
								</template>
								<td>
									<input
										type="number"
										onmousewheel={onInputWheel}
										placeholder="Lab Client"
										class="text-center"
										name="labClient"
										value={i.labClient}
										oninput={onChangeSummary}
										onfocus={onFocus}
										data-id={i.id}
									/>
								</td>
								<!--col12:Lab Client L -->
								<td>
									<button class="danger" onclick={onRemoveSite} data-id={i.id}>
										Eliminar
									</button>
								</td>
								<!--col13:Action-->
							</tr>
						</template>
						<tr
							if:true={totalSummaries}
							class="row-center row-p-05 bold bg-lgray"
						>
							<td></td>
							<!--col0:Index-->

							<td>{totalSummaries.customerSiteId}</td>
							<!--col01:Customer Site Name-->
							<td></td>
							<!--col02:Almacén-->
							<td></td>
							<!--col03:Medio de transporte-->
							<td>{totalSummaries.volume}</td>
							<!--col04:Volume 01-->
							<td></td>
							<!--col05:Volume 02-->

							<td></td>
							<!--col06:Costo-->
							<td></td>
							<!--col07:Margin-->
							<!-- TODO(2026-09-14): REVIEW CALCULO - este total de LAB Almex (promedio
							     ponderado por volumen: SUMAPRODUCTO(vol,labAlmex)/Σvol, TRUNCAR 2)
							     debe ser la fuente del input exwUsd (EXW ALMEX USD/MT). Calculado
							     en loadTotalSummary(). -->
							<td>{totalSummaries.labAlmex}</td>
							<!--col08:LAB Almex-->
							<td></td>
							<!--col09.1:Freight mxp/mt-->
							<td>{totalSummaries.usdMt}</td>
							<!--col09.2:Freight usd/mt-->
							<template lwc:if={fieldVisibility.summaryFinalFreight}>
								<td></td>
								<!--col10:Ajuste Flete-->
								<td></td>
								<!--col11:Flete Final-->
							</template>
							<td>{totalSummaries.labClient}</td>
							<!--col12:Lab Client-->

							<td></td>
							<!--col13:Action-->
						</tr>
					</tbody>
				</table>
			</section>
			<div class="my-05">
				<h2 class="text-center bg-gray rounded">SALES QUOTATION SCENARIOS</h2>
			</div>
			<section>
				<div class="grid col-2 gap-1">
					<div class="grid col-auto-1 gap-1">
						<div>
							<p>&nbsp;</p>
							<p>&nbsp;</p>
							<p class="border-white">Customer Deliv - USD/MT</p>
							<p class="border-white">EXW ALMEX USD/MT</p>
							<p class="border-white">EXW ALMEX MXN/MT</p>
							<p>&nbsp;</p>
							<p class="border-white red bold">Total Margin %</p>
							<p class="border-white red bold">Total Margin usd/mt</p>
							<p class="border-white red bold">Total Margin usd/DS</p>
							<p>&nbsp;</p>
							<p class="border-white">Additional Cost %</p>
						</div>
						<div class="grid col-1 quotation-container">
							<template for:each={leftResultsDisplay} for:item="i">
								<div
									class="text-center margin-contianer"
									key={i.key}
									data-id={i.key}
								>
									<p class="bold red">{i.option}</p>
									<p>{i.marginLabel}</p>
									<input
										type="number"
										onmousewheel={onInputWheel}
										class="bg-lorange"
										readonly={i.customerDeliv.read}
										value={i.customerDeliv.value}
										name={i.customerDeliv.name}
										oninput={onChangeQuotation}
										onfocus={onFocus}
									/>
									<!-- exwUsd (EXW ALMEX USD/MT). A/B: totalCost+margin; C: totalCost/(1-m%);
									     D: total ponderado LAB Almex (read-only) via calculateLeftQuote. -->
									<input
										type="number"
										onmousewheel={onInputWheel}
										class="bg-lorange"
										readonly={i.exwUsd.read}
										value={i.exwUsd.value}
										name={i.exwUsd.name}
										oninput={onChangeQuotation}
										onfocus={onFocus}
									/>
									<input
										type="number"
										onmousewheel={onInputWheel}
										class="bg-lorange"
										readonly={i.exwMxn.read}
										value={i.exwMxn.value}
										name={i.exwMxn.name}
										oninput={onChangeQuotation}
										onfocus={onFocus}
									/>
									<p>&nbsp;</p>
									<input
										type="number"
										onmousewheel={onInputWheel}
										class="bg-lred"
										readonly={i.totalMargin.read}
										name={i.totalMargin.name}
										value={i.totalMargin.value}
										oninput={onChangeQuotation}
										onfocus={onFocus}
										step=".1"
									/>
									<input
										type="number"
										onmousewheel={onInputWheel}
										class="bg-lred"
										readonly={i.totalMarginUsdMt.read}
										name={i.totalMarginUsdMt.name}
										value={i.totalMarginUsdMt.value}
										oninput={onChangeQuotation}
										onfocus={onFocus}
									/>
									<input
										type="number"
										onmousewheel={onInputWheel}
										class="bg-lred"
										readonly={i.totalMarginUsdDs.read}
										name={i.totalMarginUsdDs.name}
										value={i.totalMarginUsdDs.value}
										oninput={onChangeQuotation}
										onfocus={onFocus}
									/>
									<!-- Additional Cost % relocado: dato vive en rightResults (D). -->
									<p>&nbsp;</p>
									<input
										type="number"
										onmousewheel={onInputWheel}
										class="bg-lred"
										readonly={additionalCostReadonly}
										value={additionalCostValue}
										oninput={onChangeAdditionalCost}
										onfocus={onFocus}
									/>
								</div>
							</template>

						</div>
					</div>

					<template lwc:if={fieldVisibility.scenarioCostTable}>
						<div>
							<div class="grid col-auto-1 gap-1">
								<div>
									<p>&nbsp;</p>
									<p>&nbsp;</p>
									<p class="border-white">Total Cost USD/MT</p>
									<p class="border-white">SG&A USD/MT</p>
									<p class="border-white">SG&A MXN/MT</p>
									<p class="border-white">Flete USD/MT</p>
									<p class="border-white">Coproduct Recov %</p>
									<p class="border-white">Additional Cost %</p>
								</div>
								<div class="grid col-1 quotation-container">
									<template for:each={rightResultsDisplay} for:item="i">
										<div
											class="text-center margin-contianer"
											key={i.key}
											data-id={i.key}
										>
											<p class="bold red">{i.option}</p>
											<p>{i.marginLabel}</p>
											<input
												oninput={onChangeQuotation}
												readonly={i.totalCost.read}
												type="number"
												onmousewheel={onInputWheel}
												class="bg-lorange"
												value={i.totalCost.value}
												name={i.totalCost.name}
												onfocus={onFocus}
											/>
											<input
												oninput={onChangeQuotation}
												readonly={i.sgaUsd.read}
												type="number"
												onmousewheel={onInputWheel}
												class="bg-lorange"
												value={i.sgaUsd.value}
												name={i.sgaUsd.name}
												onfocus={onFocus}
											/>
											<input
												oninput={onChangeQuotation}
												readonly={i.sgaMxn.read}
												type="number"
												onmousewheel={onInputWheel}
												class="bg-lorange"
												value={i.sgaMxn.value}
												name={i.sgaMxn.name}
												onfocus={onFocus}
											/>
											<input
												oninput={onChangeQuotation}
												readonly={i.flete.read}
												type="number"
												onmousewheel={onInputWheel}
												class="bg-lred"
												value={i.flete.value}
												name={i.flete.name}
												onfocus={onFocus}
											/>
											<input
												oninput={onChangeQuotation}
												readonly={i.coproductRecov.read}
												type="number"
												onmousewheel={onInputWheel}
												class="bg-lred"
												value={i.coproductRecov.value}
												name={i.coproductRecov.name}
												onfocus={onFocus}
											/>
											<input
												oninput={onChangeQuotation}
												readonly={i.aditionalCost.read}
												type="number"
												onmousewheel={onInputWheel}
												class="bg-lred"
												value={i.aditionalCost.value}
												name={i.aditionalCost.name}
												onfocus={onFocus}
											/>
										</div>
									</template>
								</div>
							</div>
						</div>
					</template>
				</div>
				<lightning-textarea
					name="comments"
					label="Comments / Considerations:"
					lwc:ref="comments"
					value={comments}
					onchange={onChangeComments}
				></lightning-textarea>
			</section>
			<div class="my-05">
				<h2 class="text-center bg-gray rounded">MARKET REFERENCES</h2>
			</div>
			<section class="grid col-2 mt-1 gap-1">
				<div>
					<table class="supplies-table rounded">
						<thead>
							<tr>
								<th>#</th>
								<th class="bold">Month</th>
								<th style="width: 100px">
									<p class="bold">Corn</p>
									<p>US$/bu</p>
								</th>
								<template lwc:if={fieldVisibility.basis}>
									<th style="width: 100px">
										<p class="bold">Basis</p>
										<p>US$/bush</p>
									</th>
								</template>
								<template lwc:if={fieldVisibility.fx}>
									<th>
										<p class="bold">Fx</p>
										<p>Mxn/usd</p>
									</th>
								</template>
								<th>
									<p class="bold">Gas</p>
									<p>mmBTU</p>
								</th>
							</tr>
						</thead>
						<tbody>
							<template for:each={supplies} for:item="s">
								<tr key={s.Id}>
									<td>{s.index}</td>
									<td
										class="click"
										onclick={copyValue}
										data-id={s.Mes_ormula__c}
									>
										{s.Mes_ormula__c}
									</td>
									<td>
										<input
											type="number"
											onmousewheel={onInputWheel}
											value={s.Corn__c}
											oninput={onChangeSupplies}
											onfocus={onFocus}
											name="Corn__c"
											data-id={s.Id}
											class="text-center"
											readonly={isReducedView}
										/>
									</td>
									<template lwc:if={fieldVisibility.basis}>
										<td>
											<input
												type="number"
												onmousewheel={onInputWheel}
												value={s.Basis__c}
												oninput={onChangeSupplies}
												onfocus={onFocus}
												name="Basis__c"
												data-id={s.Id}
												class="text-center"
												readonly={canEditBasis}
											/>
										</td>
									</template>
									<template lwc:if={fieldVisibility.fx}>
										<td>{s.Fx__c}</td>
									</template>
									<td>{s.Gas__c}</td>
								</tr>
							</template>
							<tr if:true={marketAverages} style="font-weight: bold">
								<td></td>
								<td>Average</td>
								<td>{marketAverages.Corn__c}</td>
								<template lwc:if={fieldVisibility.basis}>
									<td>{marketAverages.Basis__c}</td>
								</template>
								<template lwc:if={fieldVisibility.fx}>
									<td>{marketAverages.Fx__c}</td>
								</template>
								<td>{marketAverages.Gas__c}</td>
							</tr>
						</tbody>
					</table>
					<template if:true={isUpdate}>
						<button class="w-full regular mt-05" onclick={loadSupplies}>
							Refrescar
						</button>
					</template>
				</div>
				<div>
					<!-- <div>
						<table class="corn-use-table rounded">
							<thead>
								<tr>
									<th>Producto</th>
									<th>Uso de Maíz</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td>Almidones</td>
									<td data-id="1.4807" onclick={onClickCornUse} class="click">1.4807</td>
								</tr>
								<tr>
									<td>Glucosas</td>
									<td data-id="1.2927" onclick={onClickCornUse} class="click">1.2927</td>
								</tr>
								<tr>
									<td>Dextrosa</td>
									<td data-id="1.0778" onclick={onClickCornUse} class="click">1.0778</td>
								</tr>
								<tr>
									<td>Dextrosa</td>
									<td data-id="1.0778" onclick={onClickCornUse} class="click">1.0778</td>
								</tr>
								<tr>
									<td>HFCS 42</td>
									<td data-id="1.0687" onclick={onClickCornUse} class="click">1.0687</td>
								</tr>
							</tbody>
						</table>
					</div> -->
					<template lwc:if={fieldVisibility.marketReferenceTable}>
						<div>
							<table class="references-tables rounded">
								<thead>
									<tr>
										<th>Variable</th>
										<th>Reference</th>
										<th>Spec</th>
									</tr>
								</thead>
								<tbody>
									<tr>
										<td>Corn date</td>
										<td>
											<input
												class="text-center"
												name="cornDate"
												type="text"
												oninput={onChangeReferenceDate}
												value={referenceDate.cornDate}
												placeholder="Corn date"
												min="0"
												readonly
											/>
										</td>
										<td>close</td>
									</tr>
									<tr>
										<td>Basis date</td>
										<td>
											<input
												class="text-center"
												name="basisDate"
												type="text"
												oninput={onChangeReferenceDate}
												value={referenceDate.basisDate}
												placeholder="Basis date"
												min="0"
												readonly
											/>
										</td>
										<td>close</td>
									</tr>
									<tr>
										<td>Fx</td>
										<td>
											<input
												class="text-center"
												name="fxDate"
												type="text"
												oninput={onChangeReferenceDate}
												value={referenceDate.fxDate}
												placeholder="Fx"
												min="0"
												readonly
											/>
										</td>
										<td>close</td>
									</tr>
									<tr>
										<td>Gas</td>
										<td>
											<input
												class="text-center"
												name="gasDate"
												type="text"
												oninput={onChangeReferenceDate}
												value={referenceDate.gasDate}
												placeholder="Gas"
												min="0"
												readonly
											/>
										</td>
										<td>close</td>
									</tr>
									<tr>
										<td>Gas transp + additional</td>
										<td class="flex justify-space">
											$ <span>{opp.Gas_transp_additional__c}</span>
										</td>
										<td>/ mmBTU</td>
									</tr>
									<tr>
										<td>Revision</td>
										<td class="text-center bold">{quotationDate}</td>
										<td>close</td>
									</tr>
									<tr>
										<td>Corn Freight to Almex</td>
										<td class="flex justify-space">
											$
											<span>{opp.Corn_Freight_to_Almex__c}</span>
										</td>
										<td class="bold">US$/bu</td>
									</tr>
									<tr>
										<td>Inflation</td>
										<td>
											<input
												class="text-right"
												name="inflation"
												type="number"
												onmousewheel={onInputWheel}
												placeholder="Inflation"
												onfocus={onFocus}
												oninput={onChangeReference}
												value={marketReference.inflation}
											/>
										</td>
										<td></td>
									</tr>
									<tr>
										<td>Corn Usage</td>
										<td>
											<input
												class="text-right"
												name="cornUsage"
												type="number"
												onmousewheel={onInputWheel}
												placeholder="Corn Usage"
												onfocus={onFocus}
												oninput={onChangeReference}
												value={opp.Uso_del_Maiz__c}
												readonly
											/>
										</td>
										<td></td>
									</tr>
								</tbody>
							</table>
						</div>
					</template>
				</div>
			</section>
			<template lwc:if={fieldVisibility.breakdownSection}>
				<div class="my-05">
					<h2 class="text-center bg-gray rounded">
						CALCULATIONS BREAKDOWN AND ANALYSIS
					</h2>
				</div>
				<section class="mt-1">
					<div class="h-table gap-05">
						<div class="col">
							<template for:each={breakdownHeaders} for:item="i">
								<div style="width: 215px" class={i.class} key={i.id}>
									{i.value}
								</div>
							</template>
						</div>
						<div class="breakdown">
							<template for:each={breakdowns} for:item="i">
								<div class="col text-right" key={i.id}>
									<div class="row">{i.cornPricePerBushelUSD}</div>
									<div class="row">{i.exchangeRate}</div>
									<div class="row text-center bg-gray bold">{i.month}</div>
									<div class="row">{i.sellingPriceLabAlmexUSDPerMT}</div>
									<div class="row">{i.netCornCostUsdGlobal}</div>
									<div class="row">{i.cogsUsdGlobal}</div>
									<!-- <div class="row">{i.netCornCostUSD}</div>
								<div class="row">{i.netCornCostUSDFixed}</div>
								<div class="row">{i.cogsUsd}</div>
								<div class="row">{i.cogsVariableUSD}</div> -->
									<div class="row bold bg-gray">{i.variableMargin}</div>
									<!-- <div class="row">{i.cogsFixedUSD}</div> -->
									<div class="row">{i.cogsFixedWithInflation}</div>
									<div class="row bold bg-gray">{i.directMargin}</div>
									<div class="row">{i.directMarginPercentage}</div>
									<!-- <div class="row">{i.sgaExpensesUSD}</div> -->
									<div class="row">{i.sgaExpensesUSDWithInflation}</div>
									<div class="row bold bg-gray">{i.pbitUSD}</div>
									<div class="row">{i.pbitPercentage}</div>
									<div class="row">{i.monthlyCostUSDPerMT}</div>
									<div class="row">{i.netCornCostPerBushelUSD}</div>
									<div class="row">{i.cogsVariablePerBushelUSD}</div>
									<div class="row">{i.cogsFixedPerBushelUSD}</div>
								</div>
							</template>
						</div>
						<div class="col text-right" if:true={averages}>
							<div class="row">{averages.cornPricePerBushelUSD}</div>
							<div class="row">{averages.exchangeRate}</div>
							<div class="row text-center bg-gray bold">{averages.month}</div>
							<div class="row">{averages.sellingPriceLabAlmexUSDPerMT}</div>
							<div class="row">{averages.netCornCostUsdGlobal}</div>
							<div class="row">{averages.cogsUsdGlobal}</div>
							<!-- <div class="row">{averages.netCornCostUSD}</div>
						<div class="row">{averages.netCornCostUSDFixed}</div> -->
							<!-- <div class="row">{averages.cogsUsd}</div>
						<div class="row">{averages.cogsVariableUSD}</div> -->
							<div class="row bold bg-gray">{averages.variableMargin}</div>
							<div class="row">{averages.cogsFixedUSD}</div>
							<div class="row bold bg-gray">{averages.directMargin}</div>
							<div class="row">{averages.directMarginPercentage}</div>
							<div class="row">{averages.sgaExpensesUSD}</div>
							<div class="row bold bg-gray">{averages.pbitUSD}</div>
							<div class="row">{averages.pbitPercentage}</div>
							<div class="row">{averages.monthlyCostUSDPerMT}</div>
							<div class="row">{averages.netCornCostPerBushelUSD}</div>
							<div class="row">{averages.cogsVariablePerBushelUSD}</div>
							<div class="row">{averages.cogsFixedPerBushelUSD}</div>
						</div>
					</div>
				</section>
			</template>
		</main>
	</template>
	<main class="main" if:true={link}>
		<section class="link-container">
			<h1>Operación exitosa</h1>
			<p>
				Puedes consultar la nueva cotización en el siguiente enlace:&nbsp;<a
					href={link}
					class="link"
					>{link}</a
				>
			</p>
			<button onclick={finishProcess} class="regular">Finalizar</button>
		</section>
	</main>
</template>
