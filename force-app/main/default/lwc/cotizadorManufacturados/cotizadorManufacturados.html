<template>
	<template if:false={link}>
		<main if:true={opp}>
			<section class="grid col-1-auto gap-1">
				<div class="grid row-1-auto gap-05">
					<div class="grid col-2 gap-1">
						<div class="flex flex-col gap-05">
							<!-- value={i.productId} onchange={onChangeRecordPicker} -->
							<label for="nombre-del-producto" class="grid" style="grid-template-columns: 150px auto">
								Producto:
								<lightning-record-picker id="nombre-del-producto" label="Producto"
									placeholder="Nombre del producto" object-api-name="Product2" variant="label-hidden"
									data-type="product" class="label-input" value={opp.Producto__c} disabled>
								</lightning-record-picker>
							</label>
							<!-- <label for="código-del-producto" class="grid col-1-auto">
							Código del producto
							<input type="text" class="input" placeholder="Codigo del producto" id="código-del-producto" />
						</label> -->
							<label for="customer-name" class="grid" style="grid-template-columns: 150px auto">
								Customer Name:
								<input type="text" placeholder="Customer Name" id="customer-name"
									value={opp.Account.Name} disabled />
							</label>
							<label for="oracle-customer-number" class="grid" style="grid-template-columns: 150px auto">
								Oracle Customer Number:
								<input type="text" placeholder="Oracle Customer Number" id="oracle-customer-number"
									value={opp.Account.N_mero_de_cuenta__c} disabled />
							</label>
							<!--
								<label for="oracle-customer-name-customer-master" class="grid col-1-auto">
								Oracle Customer Name (Customer Master)
									<input
										type="text"
										placeholder="Oracle Customer Name (Customer Master)"
										id="oracle-customer-name-customer-master"
									/>
								</label>
							-->
						</div>
						<div>
							<p class="grid col-1-auto items-center">
								Agrement - Starting date:
								<input type="date" oninput={onChangeDate} value={agreementDate.init} name="initDate" />
							</p>
							<p class="grid col-1-auto items-center">
								Agreement - Expiring date:
								<input type="date" oninput={onChangeDate} value={agreementDate.end} name="endDate" />
							</p>
						</div>
					</div>
					<div class="grid col-1-auto gap-1">
						<div>
							<p class="grid col-2 items-center">
								Calendar Year Period:
								<span class="dotted-box justify-center">{rangeDates.yearRange}</span>
							</p>
							<p class="grid col-2 items-center">
								Period: <span class="dotted-box justify-center">{rangeDates.monthRange}</span>
							</p>
						</div>
						<div>
							<p class="grid col-1-auto items-center gap-1">
								Number of Months
								<span class="dotted-box justify-center"
									style="width: 50px">{rangeDates.totalMonths}</span>
							</p>
							<p class="grid col-1-auto items-center gap-1">
								Currency
								<!-- <lightning-combobox
									name="currency"
									variant="label-hidden"
									placeholder="Seleccione una divisa"
									value={currency}
									options={currencyOptions}
									onchange={onChangeSelect}
								></lightning-combobox> -->
								<span class="dotted-box justify-center" style="width: 50px">USD</span>
							</p>
							<!-- value={value}
								options={options}
								onchange={handleChange} -->
						</div>
					</div>
				</div>
				<div class="flex flex-col gap-05">
					<label for="quotation-date">
						Quotation Date
						<input placeholder="Quotation Date" type="text" id="quotation-date" value={quotationDate}
							readonly />
					</label>
					<!-- <label for="agreement-date">
						Agreement Date <input placeholder="Agreement Date" type="text" id="agreement-date" />
					</label> -->
					<label for="invoice-selling-price">
						Terms - Invoicing Selling Price
						<select name="invoice-selling-price" id="invoice-selling-price"
							oninput={onChangeInvoiceSellingPrice} lwc:ref="invoiceSellingPrice" class="label-input">
							<option value="customer-plant">Customer plant</option>
							<option value="almex-plant">Almex Plant</option>
						</select>
					</label>
					<label for="proposed-volume-mtons">
						Proposed Volume (Mtons)
						<input placeholder="Proposed Volume (Mtons)" type="number" onmousewheel={onInputWheel}
							id="proposed-volume-mtons" value={globalVolume.proposedMtons} name="proposedMtons"
							oninput={onChangeGlobalVolume} onfocus={onFocus} class="proposed-volume-mtons" />
					</label>
					<label for="booked-volume-mtons">
						Booked Volume (Mtons)
						<input onfocus={onFocus} placeholder="Booked Volume (Mtons)" type="number"
							onmousewheel={onInputWheel} id="booked-volume-mtons" value={globalVolume.bookedMtons}
							name="bookedMtons" oninput={onChangeGlobalVolume} />
					</label>
					<label for="delivery-points-number">
						Delivery Points Number
						<input placeholder="Delivery Points Number" type="number" onmousewheel={onInputWheel}
							id="delivery-points-number" value={globalVolume.pointsNumebr} name="pointsNumebr"
							oninput={onChangeGlobalVolume} onfocus={onFocus} />
					</label>
					<div class={completeClass}>
						<span class="dotted-box justify-center check-label">{checkCompleto}</span>
					</div>
					<button class="regular" onclick={saveQuote} disabled={checked} lwc:if={canSave}>Guardar</button>
				</div>
			</section>
			<div class="my-05">
				<h2 class="text-center bg-gray rounded">SALES QUOTATION SCENARIOS</h2>
			</div>
			<section>
				<div class="grid col-2 gap-1">
					<div class="grid col-auto-1 gap-1">
						<div>
							<p>&nbsp;</p>
							<p>&nbsp;</p>
							<p class="border-white">Customer Deliv - USD/MT</p>
							<p class="border-white">EXW ALMEX USD/MT</p>
							<p class="border-white">EXW ALMEX MXN/MT</p>
							<p>&nbsp;</p>
							<p class="border-white red bold">Total Margin %</p>
							<p class="border-white red bold">Total Margin usd/mt</p>
							<p class="border-white red bold">Total Margin usd/DS</p>
						</div>
						<div class="grid col-5 quotation-container">
							<template for:each={leftResults} for:item="i">
								<div class="text-center margin-contianer" key={i.key} data-id={i.key}>
									<p class="bold red">{i.option}</p>
									<p>{i.marginLabel}</p>
									<input type="number" onmousewheel={onInputWheel} class="bg-lorange"
										readonly={i.customerDeliv.read} value={i.customerDeliv.value}
										name={i.customerDeliv.name} oninput={onChangeQuotation} onfocus={onFocus} />
									<input type="number" onmousewheel={onInputWheel} class="bg-lorange"
										readonly={i.exwUsd.read} value={i.exwUsd.value} name={i.exwUsd.name}
										oninput={onChangeQuotation} onfocus={onFocus} />
									<input type="number" onmousewheel={onInputWheel} class="bg-lorange"
										readonly={i.exwMxn.read} value={i.exwMxn.value} name={i.exwMxn.name}
										oninput={onChangeQuotation} onfocus={onFocus} />
									<p>&nbsp;</p>
									<input type="number" onmousewheel={onInputWheel} class="bg-lred"
										readonly={i.totalMargin.read} name={i.totalMargin.name}
										value={i.totalMargin.value} oninput={onChangeQuotation} onfocus={onFocus}
										step=".1" />
									<input type="number" onmousewheel={onInputWheel} class="bg-lred"
										readonly={i.totalMarginUsdMt.read} name={i.totalMarginUsdMt.name}
										value={i.totalMarginUsdMt.value} oninput={onChangeQuotation}
										onfocus={onFocus} />
									<input type="number" onmousewheel={onInputWheel} class="bg-lred"
										readonly={i.totalMarginUsdDs.read} name={i.totalMarginUsdDs.name}
										value={i.totalMarginUsdDs.value} oninput={onChangeQuotation}
										onfocus={onFocus} />
								</div>
							</template>
							<div class="text-center margin-contianer">
								<p class="red bold">Definitiva</p>
								<div class="grid place-center">
									<select name="leftPriceSelect" class="text-center bold w-full border-none"
										onchange={onChangeSelect} lwc:ref="leftSelect">
										<template for:each={quotationOptions} for:item="i">
											<option value={i.value} key={i.value}>{i.label}</option>
										</template>
									</select>
								</div>
								<div if:true={currentLeftPrice}>
									<input readonly type="number" onmousewheel={onInputWheel} class="bg-lorange"
										value={currentLeftPrice.customerDeliv.value} />
									<input readonly type="number" onmousewheel={onInputWheel} class="bg-lorange"
										value={currentLeftPrice.exwUsd.value} />
									<input readonly type="number" onmousewheel={onInputWheel} class="bg-lorange"
										value={currentLeftPrice.exwMxn.value} />
									<p>&nbsp;</p>
									<input readonly type="number" onmousewheel={onInputWheel} class="bg-lred"
										value={currentLeftPrice.totalMargin.value} />
									<input readonly type="number" onmousewheel={onInputWheel} class="bg-lred"
										value={currentLeftPrice.totalMarginUsdMt.value} />
									<input readonly type="number" onmousewheel={onInputWheel} class="bg-lred"
										value={currentLeftPrice.totalMarginUsdDs.value} />
								</div>
							</div>
						</div>
					</div>
					<div>
						<div class="grid col-auto-1 gap-1">
							<div>
								<p>&nbsp;</p>
								<p>&nbsp;</p>
								<p class="border-white">Total Cost USD/MT</p>
								<p class="border-white">SG&A USD/MT</p>
								<p class="border-white">SG&A MXN/MT</p>
								<p class="border-white">Flete USD/MT</p>
								<p class="border-white">Coproduct Recov %</p>
								<p class="border-white">Additional Cost %</p>
							</div>
							<div class="grid col-5 quotation-container">
								<template for:each={rightResults} for:item="i">
									<div class="text-center margin-contianer" key={i.key} data-id={i.key}>
										<p class="bold red">{i.option}</p>
										<p>{i.marginLabel}</p>
										<input oninput={onChangeQuotation} readonly={i.totalCost.read} type="number"
											onmousewheel={onInputWheel} class="bg-lorange" value={i.totalCost.value}
											name={i.totalCost.name} onfocus={onFocus} />
										<input oninput={onChangeQuotation} readonly={i.sgaUsd.read} type="number"
											onmousewheel={onInputWheel} class="bg-lorange" value={i.sgaUsd.value}
											name={i.sgaUsd.name} onfocus={onFocus} />
										<input oninput={onChangeQuotation} readonly={i.sgaMxn.read} type="number"
											onmousewheel={onInputWheel} class="bg-lorange" value={i.sgaMxn.value}
											name={i.sgaMxn.name} onfocus={onFocus} />
										<input oninput={onChangeQuotation} readonly={i.flete.read} type="number"
											onmousewheel={onInputWheel} class="bg-lred" value={i.flete.value}
											name={i.flete.name} onfocus={onFocus} />
										<input oninput={onChangeQuotation} readonly={i.coproductRecov.read}
											type="number" onmousewheel={onInputWheel} class="bg-lred"
											value={i.coproductRecov.value} name={i.coproductRecov.name}
											onfocus={onFocus} />
										<input oninput={onChangeQuotation} readonly={i.aditionalCost.read} type="number"
											onmousewheel={onInputWheel} class="bg-lred" value={i.aditionalCost.value}
											name={i.aditionalCost.name} onfocus={onFocus} />
									</div>
								</template>
								<div class="text-center margin-contianer">
									<p class="red bold">Definitiva</p>
									<div class="grid place-center">
										<select name="rightPriceSelect" class="text-center bold w-full border-none"
											onchange={onChangeSelect} lwc:ref="rightSelect">
											<template for:each={quotationOptions} for:item="i">
												<option value={i.value} key={i.value}>{i.label}</option>
											</template>
										</select>
									</div>
									<div if:true={currentRightPrice}>
										<input readonly type="number" onmousewheel={onInputWheel} class="bg-lorange"
											value={currentRightPrice.totalCost.value} />
										<input readonly type="number" onmousewheel={onInputWheel} class="bg-lorange"
											value={currentRightPrice.sgaUsd.value} />
										<input readonly type="number" onmousewheel={onInputWheel} class="bg-lorange"
											value={currentRightPrice.sgaMxn.value} />
										<input readonly type="number" onmousewheel={onInputWheel} class="bg-lred"
											value={currentRightPrice.flete.value} />
										<input readonly type="number" onmousewheel={onInputWheel} class="bg-lred"
											value={currentRightPrice.coproductRecov.value} />
										<input readonly type="number" onmousewheel={onInputWheel} class="bg-lred"
											value={currentRightPrice.aditionalCost.value} />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<lightning-textarea name="comments" label="Comments / Considerations:" lwc:ref="comments"
					value={comments} onchange={onChangeComments}></lightning-textarea>
			</section>
			<div class="my-05">
				<h2 class="text-center bg-gray rounded">MARKET REFERENCES</h2>
			</div>
			<section class="grid col-2 mt-1 gap-1">
				<div>
					<table class="supplies-table rounded">
						<thead>
							<tr>
								<th>#</th>
								<th class="bold">Month</th>
								<th style="width: 100px">
									<p class="bold">Corn</p>
									<p>US$/bu</p>
								</th>
								<th style="width: 100px">
									<p class="bold">Basis</p>
									<p>US$/bush</p>
								</th>
								<th>
									<p class="bold">Fx</p>
									<p>Mxn/usd</p>
								</th>
								<th>
									<p class="bold">Gas</p>
									<p>mmBTU</p>
								</th>
							</tr>
						</thead>
						<tbody>
							<template for:each={supplies} for:item="s">
								<tr key={s.Id}>
									<td>{s.index}</td>
									<td class="click" onclick={copyValue} data-id={s.Mes_ormula__c}>
										{s.Mes_ormula__c}
									</td>
									<td>
										<input type="number" onmousewheel={onInputWheel} value={s.Corn__c}
											oninput={onChangeSupplies} onfocus={onFocus} name="Corn__c" data-id={s.Id}
											class="text-center" readonly={canEditCorn} />
									</td>
									<td>
										<input type="number" onmousewheel={onInputWheel} value={s.Basis__c}
											oninput={onChangeSupplies} onfocus={onFocus} name="Basis__c" data-id={s.Id}
											class="text-center" readonly={canEditBasis} />
									</td>
									<td>{s.Fx__c}</td>
									<td>{s.Gas__c}</td>
								</tr>
							</template>
							<tr if:true={marketAverages} style="font-weight: bold">
								<td></td>
								<td>Average</td>
								<td>{marketAverages.Corn__c}</td>
								<td>{marketAverages.Basis__c}</td>
								<td>{marketAverages.Fx__c}</td>
								<td>{marketAverages.Gas__c}</td>
							</tr>
						</tbody>
					</table>
					<template if:true={isUpdate}>
						<button class="w-full regular mt-05" onclick={loadSupplies}>Refrescar</button>
					</template>
				</div>
				<div>
					<!-- <div>
						<table class="corn-use-table rounded">
							<thead>
								<tr>
									<th>Producto</th>
									<th>Uso de Maíz</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td>Almidones</td>
									<td data-id="1.4807" onclick={onClickCornUse} class="click">1.4807</td>
								</tr>
								<tr>
									<td>Glucosas</td>
									<td data-id="1.2927" onclick={onClickCornUse} class="click">1.2927</td>
								</tr>
								<tr>
									<td>Dextrosa</td>
									<td data-id="1.0778" onclick={onClickCornUse} class="click">1.0778</td>
								</tr>
								<tr>
									<td>Dextrosa</td>
									<td data-id="1.0778" onclick={onClickCornUse} class="click">1.0778</td>
								</tr>
								<tr>
									<td>HFCS 42</td>
									<td data-id="1.0687" onclick={onClickCornUse} class="click">1.0687</td>
								</tr>
							</tbody>
						</table>
					</div> -->
					<div>
						<table class="references-tables rounded">
							<thead>
								<tr>
									<th>Variable</th>
									<th>Reference</th>
									<th>Spec</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td>Corn date</td>
									<td>
										<input class="text-center" name="cornDate" type="text"
											oninput={onChangeReferenceDate} value={referenceDate.cornDate}
											placeholder="Corn date" min="0" readonly />
									</td>
									<td>close</td>
								</tr>
								<tr>
									<td>Basis date</td>
									<td>
										<input class="text-center" name="basisDate" type="text"
											oninput={onChangeReferenceDate} value={referenceDate.basisDate}
											placeholder="Basis date" min="0" readonly />
									</td>
									<td>close</td>
								</tr>
								<tr>
									<td>Fx</td>
									<td>
										<input class="text-center" name="fxDate" type="text"
											oninput={onChangeReferenceDate} value={referenceDate.fxDate}
											placeholder="Fx" min="0" readonly />
									</td>
									<td>close</td>
								</tr>
								<tr>
									<td>Gas</td>
									<td>
										<input class="text-center" name="gasDate" type="text"
											oninput={onChangeReferenceDate} value={referenceDate.gasDate}
											placeholder="Gas" min="0" readonly />
									</td>
									<td>close</td>
								</tr>
								<tr>
									<td>Gas transp + additional</td>
									<td class="flex justify-space">$ <span>{opp.Gas_transp_additional__c}</span></td>
									<td>/ mmBTU</td>
								</tr>
								<tr>
									<td>Revision</td>
									<td class="text-center bold">{quotationDate}</td>
									<td>close</td>
								</tr>
								<tr>
									<td>Corn Freight to Almex</td>
									<td class="flex justify-space">
										$
										<span>{opp.Corn_Freight_to_Almex__c}</span>
									</td>
									<td class="bold">US$/bu</td>
								</tr>
								<tr>
									<td>Inflation</td>
									<td>
										<input class="text-right" name="inflation" type="number"
											onmousewheel={onInputWheel} placeholder="Inflation" onfocus={onFocus}
											oninput={onChangeReference} value={marketReference.inflation} />
									</td>
									<td></td>
								</tr>
								<tr>
									<td>Corn Usage</td>
									<td>
										<input class="text-right" name="cornUsage" type="number"
											onmousewheel={onInputWheel} placeholder="Corn Usage" onfocus={onFocus}
											oninput={onChangeReference} value={opp.Uso_del_Maiz__c} readonly />
									</td>
									<td></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</section>
			<div class="my-05">
				<h2 class="text-center bg-gray rounded">CALCULATIONS BREAKDOWN AND ANALYSIS</h2>
			</div>
			<section class="mt-1">
				<div class="h-table gap-05">
					<div class="col">
						<template for:each={breakdownHeaders} for:item="i">
							<div style="width: 215px" class={i.class} key={i.id}>{i.value}</div>
						</template>
					</div>
					<div class="breakdown">
						<template for:each={breakdowns} for:item="i">
							<div class="col text-right" key={i.id}>
								<div class="row">{i.cornPricePerBushelUSD}</div>
								<div class="row">{i.exchangeRate}</div>
								<div class="row text-center bg-gray bold">{i.month}</div>
								<div class="row">{i.sellingPriceLabAlmexUSDPerMT}</div>
								<div class="row">{i.netCornCostUsdGlobal}</div>
								<div class="row">{i.cogsUsdGlobal}</div>
								<!-- <div class="row">{i.netCornCostUSD}</div>
								<div class="row">{i.netCornCostUSDFixed}</div>
								<div class="row">{i.cogsUsd}</div>
								<div class="row">{i.cogsVariableUSD}</div> -->
								<div class="row bold bg-gray">{i.variableMargin}</div>
								<!-- <div class="row">{i.cogsFixedUSD}</div> -->
								<div class="row">{i.cogsFixedWithInflation}</div>
								<div class="row bold bg-gray">{i.directMargin}</div>
								<div class="row">{i.directMarginPercentage}</div>
								<!-- <div class="row">{i.sgaExpensesUSD}</div> -->
								<div class="row">{i.sgaExpensesUSDWithInflation}</div>
								<div class="row bold bg-gray">{i.pbitUSD}</div>
								<div class="row">{i.pbitPercentage}</div>
								<div class="row">{i.monthlyCostUSDPerMT}</div>
								<div class="row">{i.netCornCostPerBushelUSD}</div>
								<div class="row">{i.cogsVariablePerBushelUSD}</div>
								<div class="row">{i.cogsFixedPerBushelUSD}</div>
							</div>
						</template>
					</div>
					<div class="col text-right" if:true={averages}>
						<div class="row">{averages.cornPricePerBushelUSD}</div>
						<div class="row">{averages.exchangeRate}</div>
						<div class="row text-center bg-gray bold">{averages.month}</div>
						<div class="row">{averages.sellingPriceLabAlmexUSDPerMT}</div>
						<div class="row">{averages.netCornCostUsdGlobal}</div>
						<div class="row">{averages.cogsUsdGlobal}</div>
						<!-- <div class="row">{averages.netCornCostUSD}</div>
						<div class="row">{averages.netCornCostUSDFixed}</div> -->
						<!-- <div class="row">{averages.cogsUsd}</div>
						<div class="row">{averages.cogsVariableUSD}</div> -->
						<div class="row bold bg-gray">{averages.variableMargin}</div>
						<div class="row">{averages.cogsFixedUSD}</div>
						<div class="row bold bg-gray">{averages.directMargin}</div>
						<div class="row">{averages.directMarginPercentage}</div>
						<div class="row">{averages.sgaExpensesUSD}</div>
						<div class="row bold bg-gray">{averages.pbitUSD}</div>
						<div class="row">{averages.pbitPercentage}</div>
						<div class="row">{averages.monthlyCostUSDPerMT}</div>
						<div class="row">{averages.netCornCostPerBushelUSD}</div>
						<div class="row">{averages.cogsVariablePerBushelUSD}</div>
						<div class="row">{averages.cogsFixedPerBushelUSD}</div>
					</div>
				</div>
			</section>
			<div class="my-05">
				<h2 class="text-center bg-gray rounded">
					CRITICAL FILLOUT - SALES SUMMARY BY PLANT - FOR PRICING PURPOSES
				</h2>
			</div>
			<section>
				<div class="text-right mb-05">
					<button class="regular" onclick={onClickNewSite} type="button">Agregar Sucursal</button>
				</div>
				<table class="summary-table">
					<thead>
						<tr class="row-center">
							<th rowspan="2">Index</th>
							<th rowspan="2" style="width: 250px">Customer Site Name</th>
							<th rowspan="2" style="width: 200px">Almacén</th>
							<th rowspan="2" style="width: 200px">Medio de transporte</th>
							<th style="width: 100px">Volume</th>
							<th style="width: 80px">Volume</th>
							<th style="width: 70px">Costo</th>
							<th style="width: 70px">Margin</th>
							<th>LAB Almex</th>
							<th colspan="2">Freight</th>
							<th>Ajuste Flete</th>
							<th>Flete Final</th>
							<th>Lab Client</th>
							<th rowspan="2">Acciones</th>
						</tr>
						<tr class="row-center">
							<th class="legend green">mt/year</th>
							<th class="legend green">mt/embarque</th>
							<th class="legend green">usd/mt</th>
							<th class="legend green">usd/mt</th>
							<th class="legend green">usd/mt</th>
							<th class="legend green" style="width: 100px">mxp/mt</th>
							<th class="legend green" style="width: 100px">usd/mt</th>
							<th class="legend green">usd/mt</th>
							<th class="legend green">usd/mt</th>
							<th class="legend green">usd/mt</th>
						</tr>
					</thead>
					<tbody>
						<template for:each={summaries} for:item="i">
							<tr class="row-center" key={i.id}>
								<td>{i.index}</td>
								<td>
									<lightning-record-picker label="Sucursales" placeholder="Sucursal"
										object-api-name="Sucursal__c" variant="label-hidden" data-type="customer-site"
										onchange={onChangeSite} value={i.customerSiteId} data-id={i.id} filter={filter}
										name="customerSiteId">
									</lightning-record-picker>
								</td>
								<!-- input-almacen -->
								<td>
									<lightning-record-picker label="Almacén" placeholder="Almacén"
										object-api-name="Planta__c" variant="label-hidden" value={i.plantId}
										data-id={i.id} onchange={onChangeSite} name="plantId">
										<!-- onchange={onChangePlant} -->
									</lightning-record-picker>
								</td>
								<!-- input-medio-transporte -->
								<td>
									<lightning-combobox class={i.id} data-column={i.id} data-id={i.id}
										name="transportation" variant="label-hidden" options={transportType}
										onchange={onChangeSite} value={i.transportation}></lightning-combobox>
								</td>
								<td>
									<input type="number" onmousewheel={onInputWheel} placeholder="Volume"
										class="text-center" name="volume" value={i.volume} oninput={onChangeSummary}
										onfocus={onFocus} data-id={i.id} />
								</td>
								<td>
									<input type="number" onmousewheel={onInputWheel} min="1" placeholder="Volume"
										class="text-center" name="monthVolume" value={i.monthVolume}
										oninput={onChangeSummary} onfocus={onFocus} data-id={i.id} />
								</td>
								<td>{i.cost}</td>
								<td>{i.margin}</td>
								<td>{i.labAlmex}</td>
								<td>
									<input type="number" onmousewheel={onInputWheel} placeholder="Mxp Mt"
										class="text-center" value={i.visibleMxpMt} oninput={onChangeSummary} readonly />
								</td>
								<td>{i.usdMt}</td>
								<td>
									<input type="number" onmousewheel={onInputWheel} placeholder="Volume"
										class="text-center" name="freightAddition" value={i.freightAddition}
										oninput={onChangeSummary} onfocus={onFocus} data-id={i.id} />
								</td>
								<td>{i.finalFreight}</td>
								<td>{i.labClient}</td>
								<td>
									<button class="danger" onclick={onRemoveSite} data-id={i.id}>Eliminar</button>
								</td>
							</tr>
						</template>
						<tr if:true={totalSummaries} class="row-center row-p-05 bold bg-lgray">
							<td></td>
							<td>{totalSummaries.customerSiteId}</td>
							<td></td>
							<td></td>
							<td>{totalSummaries.volume}</td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
						</tr>
					</tbody>
				</table>
			</section>
		</main>
	</template>
	<main class="main" if:true={link}>
		<section class="link-container">
			<h1>Operación exitosa</h1>
			<p>
				Puedes consultar la nueva cotización en el siguiente enlace:&nbsp;<a href={link} class="link">{link}</a>
			</p>
			<button onclick={finishProcess} class="regular">Finalizar</button>
		</section>
	</main>
</template>
