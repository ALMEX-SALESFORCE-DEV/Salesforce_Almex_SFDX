<template>
    <div class="page-shell" onmousedown={handleFormCalendarInteraction}
        onfocusin={handleFormCalendarInteraction} ontouchstart={handleFormCalendarInteraction}>
        <header class="hero">
            <div class="hero__identity">
                <span class="hero__icon" aria-hidden="true">
                    <lightning-icon icon-name="utility:edit" size="small" variant="inverse"></lightning-icon>
                </span>
                <div>
                    <div class="title-line">
                        <h1>Registro de Mapeo de mercado</h1>
                        <span class="status-pill"><span class="status-dot"></span>Nuevo registro</span>
                    </div>
                    <p>Captura información para el análisis y seguimiento del mercado.</p>
                </div>
            </div>

            <aside class="summary" aria-label="Resumen del registro">
                <h2>Resumen del registro</h2>
                <div class="summary__grid">
                    <div>
                        <span>Producto</span>
                        <strong>{productSummary}</strong>
                    </div>
                    <div>
                        <span>Periodo</span>
                        <strong>{periodSummary}</strong>
                    </div>
                    <div>
                        <span>Unidad</span>
                        <strong>{unitSummary}</strong>
                    </div>
                </div>
            </aside>
        </header>

        <template lwc:if={locationError}>
            <div class="alert" role="alert">
                <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                <span>{locationError}</span>
            </div>
        </template>

        <form onsubmit={handleSubmit} autocomplete="off" novalidate>
            <section class="form-card form-card--product" aria-labelledby="product-section-title">
                <div class="section-heading">
                    <span class="section-number">1</span>
                    <div>
                        <h2 id="product-section-title">Producto y periodo</h2>
                        <p>Selecciona el producto, subproducto y periodo de referencia.</p>
                    </div>
                </div>

                <div class={productGridClass}>
                    <div class="form-field">
                        <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Tipo de producto</span>
                        <lightning-combobox variant="label-hidden"
                            name="productName"
                            label="Tipo de producto"
                            value={form.productName}
                            options={productOptions}
                            placeholder="Selecciona un producto"
                            onchange={handleProductChange}
                            required>
                        </lightning-combobox>
                    </div>

                    <template lwc:if={showSubproduct}>
                        <div class="field-with-help">
                            <div class="form-field">
                                <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Subproducto</span>
                                <lightning-combobox variant="label-hidden"
                                    name="subproductType"
                                    label="Subproducto"
                                    value={form.subproductType}
                                    options={subproductOptions}
                                    placeholder="Selecciona un subproducto"
                                    onchange={handleSubproductChange}
                                    required>
                                </lightning-combobox>
                            </div>
                            <p class="field-help">
                                <lightning-icon icon-name="utility:info" size="xx-small"></lightning-icon>
                                <span>El subproducto se actualiza según el tipo de producto seleccionado.</span>
                            </p>
                        </div>
                    </template>

                    <template lwc:if={showShipmentSize}>
                        <div class={shipmentFieldClass}>
                        <div class="shipment-select">
                        <span class="native-field__label"><span>*</span> Tamaño de embarque</span>
                        <lightning-combobox
                            name="shipmentSize"
                            label="Tamaño de embarque"
                            variant="label-hidden"
                            value={form.shipmentSize}
                            options={shipmentSizeOptions}
                            placeholder="Selecciona un tamaño"
                            onchange={handleFieldChange}
                            required>
                        </lightning-combobox>
                        </div>
                        <template lwc:if={showOtherShipmentSize}>
                            <div class="custom-shipment">
                                <label class="native-field__label" for="other-shipment"><span>*</span> Cantidad</label>
                                <div class="custom-shipment__control">
                                    <input id="other-shipment" class="slds-input" data-field="otherShipmentSize"
                                        autocomplete="off"
                                        aria-label="Otro tamaño de embarque en toneladas"
                                        type="text" inputmode="numeric" pattern="[0-9]+" maxlength="10"
                                        value={form.otherShipmentSize} oninput={handleOtherShipmentInput} required />
                                    <span class="custom-shipment__unit">Ton</span>
                                </div>
                            </div>
                        </template>
                        </div>
                    </template>

                    <div class="form-field">
                        <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Año</span>
                        <lightning-combobox variant="label-hidden"
                            name="periodYear"
                            label="Año"
                            value={form.periodYear}
                            options={yearOptions}
                            onchange={handleFieldChange}
                            required>
                        </lightning-combobox>
                    </div>

                </div>

                <div class="field-grid field-grid--operation slds-m-top_medium">
                    <div class="form-field">
                        <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Tipo de operación comercial</span>
                        <lightning-combobox variant="label-hidden" name="commercialOperationType" label="Tipo de operación comercial"
                            value={form.commercialOperationType} options={commercialOperationOptions}
                            placeholder="Selecciona Contrato, Spot o Propuesta" onchange={handleFieldChange} required>
                        </lightning-combobox>
                    </div>
                    <template lwc:if={isContract}>
                        <div class="contract-date-field" data-contract-field="contractStartDate">
                            <label class="native-field__label" for="contract-start"><span>*</span> De</label>
                            <div class="contract-date-control">
                                <input id="contract-start" class="contract-date-input slds-input" type="text" name="contractStartDate"
                                    autocomplete="off" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10"
                                    value={contractStartDateDisplay} oninput={handleContractDateInput} onblur={handleContractDateBlur} required />
                                <button type="button" class="calendar-button" data-date-field="contractStartDate" onclick={openContractCalendar} aria-label="Elegir fecha de inicio">
                                    <lightning-icon icon-name="utility:event" size="x-small"></lightning-icon>
                                </button>
                            </div>
                            <div class="contract-calendar-host" data-calendar="contractStartDate" lwc:dom="manual"></div>
                        </div>
                        <div class="contract-date-field" data-contract-field="contractEndDate">
                            <label class="native-field__label" for="contract-end"><span>*</span> A</label>
                            <div class="contract-date-control">
                                <input id="contract-end" class="contract-date-input slds-input" type="text" name="contractEndDate"
                                    autocomplete="off" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10"
                                    value={contractEndDateDisplay} oninput={handleContractDateInput} onblur={handleContractDateBlur} required />
                                <button type="button" class="calendar-button" data-date-field="contractEndDate" onclick={openContractCalendar} aria-label="Elegir fecha de fin">
                                    <lightning-icon icon-name="utility:event" size="x-small"></lightning-icon>
                                </button>
                            </div>
                            <div class="contract-calendar-host" data-calendar="contractEndDate" lwc:dom="manual"></div>
                        </div>
                    </template>
                    <div class="product-origin" role="group" aria-label="Origen del producto">
                        <span class="native-field__label">Origen del producto</span>
                        <div class="product-origin-options">
                            <label class={nationalProductClass}>
                                <input type="checkbox" autocomplete="off" data-origin="national"
                                    checked={isNationalProduct} onchange={handleProductOriginChange} />
                                <span>Producto nacional</span>
                            </label>
                            <label class={importedProductClass}>
                                <input type="checkbox" autocomplete="off" data-origin="imported"
                                    checked={isImportedProduct} onchange={handleProductOriginChange} />
                                <span>Producto importado</span>
                            </label>
                        </div>
                    </div>
                </div>

            </section>

            <section class="form-card form-card--commercial" aria-labelledby="commercial-section-title">
                <div class="section-heading">
                    <span class="section-number">2</span>
                    <div>
                        <h2 id="commercial-section-title">Información comercial</h2>
                        <p>Selecciona el cliente y su sucursal o registra un prospecto.</p>
                    </div>
                </div>

                <div class="party-mode" role="group" aria-label="Tipo de registro comercial">
                    <button
                        type="button"
                        class={clientModeClass}
                        data-mode="client"
                        onclick={handlePartyModeChange}
                        aria-pressed={isClientMode}>
                        <lightning-icon icon-name="standard:account" size="x-small"></lightning-icon>
                        <span>Cliente</span>
                    </button>
                    <button
                        type="button"
                        class={prospectModeClass}
                        data-mode="prospect"
                        onclick={handlePartyModeChange}
                        aria-pressed={isProspectMode}>
                        <lightning-icon icon-name="standard:lead" size="x-small"></lightning-icon>
                        <span>Prospecto</span>
                    </button>
                </div>

                <template lwc:if={isClientMode}>
                    <div class={accountLookupClass}>
                        <div class="form-field">
                            <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Nombre del cliente</span>
                            <lightning-input variant="label-hidden" type="search" name="clientAccount" label="Nombre del cliente"
                                value={accountSearch} placeholder="Escribe el nombre de la cuenta..." autocomplete="off"
                                onchange={handleAccountSearch} onfocus={handleAccountFocus} onblur={handleAccountBlur} required>
                            </lightning-input>
                        </div>
                        <template lwc:if={showAccountSuggestions}>
                            <div class="account-lookup__menu" role="listbox" aria-label="Clientes encontrados">
                                <template for:each={accountSuggestions} for:item="account">
                                    <button key={account.Id} type="button" class="account-lookup__option" data-id={account.Id}
                                        onmousedown={handleLookupOptionMouseDown} onclick={selectAccount} role="option">
                                        <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                                        <span class="account-lookup__copy"><strong>{account.Name}</strong></span>
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={accountSearchMessage}><p class="account-lookup__message">{accountSearchMessage}</p></template>
                    </div>
                    <div class={branchLookupClass} onfocusout={handleBranchBlur} onkeydown={handleBranchKeyDown}>
                        <span id="client-branch-label" class="native-field__label"><span>*</span> Sucursal del cliente</span>
                        <button type="button" class="branch-selector" role="combobox" aria-labelledby="client-branch-label"
                            aria-expanded={showBranchSuggestions} aria-haspopup="listbox" disabled={branchSelectorDisabled}
                            onclick={toggleBranchOptions}>
                            <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                            <span class="account-lookup__copy"><strong>{branchSelectorLabel}</strong><small>{branchSelectorSubtitle}</small></span>
                            <lightning-icon class="branch-selector-chevron" icon-name="utility:chevrondown" size="xx-small"></lightning-icon>
                        </button>
                        <template lwc:if={isSearchingBranches}>
                            <lightning-spinner
                                class="account-lookup__spinner"
                                alternative-text="Buscando sucursales"
                                size="x-small">
                            </lightning-spinner>
                        </template>
                        <template lwc:if={showBranchSuggestions}>
                            <div class="account-lookup__menu" role="listbox" aria-label="Sucursales encontradas">
                                <template for:each={branchOptions} for:item="branch">
                                    <button
                                        key={branch.branchId}
                                        type="button"
                                        class="account-lookup__option"
                                        data-id={branch.branchId}
                                        onmousedown={handleLookupOptionMouseDown}
                                        onclick={selectBranch}
                                        aria-selected={branch.selected}
                                        role="option">
                                        <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                                        <span class="account-lookup__copy">
                                            <strong>{branch.name}</strong>
                                            <small>{branch.subtitle}</small>
                                        </span>
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={branchSearchMessage}>
                            <p class="account-lookup__message">{branchSearchMessage}</p>
                        </template>
                    </div>
                </template>

                <template lwc:if={isClientMode}>
                    <div class="field-grid field-grid--commercial">
                        <div class="form-field">
                            <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Nombre comercial / Razón social</span>
                            <lightning-input variant="label-hidden"
                                data-field="commercialName"
                                autocomplete="off"
                                label="Nombre comercial / Razón social"
                                value={form.commercialName}
                                onchange={handleTextChange}
                                read-only
                                maxlength="255"
                                required>
                            </lightning-input>
                        </div>

                        <div class="form-field">
                            <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Estado</span>
                            <lightning-input variant="label-hidden"
                                data-field="state"
                                autocomplete="off"
                                label="Estado"
                                value={form.state}
                                onchange={handleTextChange}
                                maxlength="255"
                                required>
                            </lightning-input>
                        </div>

                        <div class="form-field">
                            <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Municipio</span>
                            <lightning-input variant="label-hidden"
                                data-field="municipality"
                                autocomplete="off"
                                label="Municipio"
                                value={form.municipality}
                                onchange={handleTextChange}
                                maxlength="255"
                                required>
                            </lightning-input>
                        </div>

                        <div class="form-field">
                            <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Ciudad</span>
                            <lightning-input variant="label-hidden"
                                data-field="city"
                                autocomplete="off"
                                label="Ciudad"
                                value={form.city}
                                onchange={handleTextChange}
                                maxlength="255"
                                required>
                            </lightning-input>
                        </div>
                    </div>
                </template>

                <template lwc:if={isProspectMode}>
                    <div class="field-grid field-grid--commercial">
                        <div class="form-field">
                            <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Nombre comercial / Razón social</span>
                            <lightning-input variant="label-hidden"
                                data-field="commercialName"
                                autocomplete="off"
                                label="Nombre comercial / Razón social"
                                value={form.commercialName}
                                onchange={handleTextChange}
                                maxlength="255"
                                required>
                            </lightning-input>
                        </div>

                        <div class="lookup">
                            <div class="form-field">
                                <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Estado</span>
                                <lightning-input variant="label-hidden"
                                    data-location="state"
                                    type="search"
                                    label="Estado"
                                    value={clientStateSearch}
                                    placeholder="Escribe para buscar"
                                    onchange={handleClientStateSearch}
                                    onfocus={handleClientStateFocus}
                                    onblur={handleLookupBlur}
                                    autocomplete="off"
                                    disabled={isLocationDisabled}
                                    required>
                                </lightning-input>
                            </div>
                            <template lwc:if={showClientStateResults}>
                                <div class="lookup__menu" role="listbox" aria-label="Estados disponibles">
                                    <template for:each={clientStateMatches} for:item="option">
                                        <button
                                            key={option.value}
                                            type="button"
                                            class="lookup__option"
                                            data-value={option.value}
                                            onmousedown={handleLookupOptionMouseDown}
                                            onclick={selectClientState}
                                            role="option">
                                            {option.label}
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <div class="lookup">
                            <div class="form-field">
                                <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Municipio</span>
                                <lightning-input variant="label-hidden"
                                    data-location="municipality"
                                    type="search"
                                    label="Municipio"
                                    value={municipalitySearch}
                                    placeholder="Busca un municipio o ciudad"
                                    onchange={handleMunicipalitySearch}
                                    onfocus={handleMunicipalityFocus}
                                    onblur={handleLookupBlur}
                                    autocomplete="off"
                                    disabled={isMunicipalityDisabled}
                                    required>
                                </lightning-input>
                            </div>
                            <template lwc:if={showMunicipalityResults}>
                                <div class="lookup__menu" role="listbox" aria-label="Municipios y ciudades disponibles">
                                    <template for:each={municipalityMatches} for:item="option">
                                        <button
                                            key={option.id}
                                            type="button"
                                            class="lookup__option"
                                            data-municipality={option.municipality}
                                            data-city={option.city}
                                            onmousedown={handleLookupOptionMouseDown}
                                            onclick={selectMunicipality}
                                            role="option">
                                            {option.label}
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <div class="form-field">
                            <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Ciudad</span>
                            <lightning-input variant="label-hidden"
                                data-field="city"
                                autocomplete="off"
                                label="Ciudad"
                                value={form.city}
                                read-only
                                required>
                            </lightning-input>
                        </div>
                    </div>
                </template>
            </section>

            <section class="form-card form-card--price" aria-labelledby="price-section-title">
                <div class="section-heading">
                    <span class="section-number">3</span>
                    <div>
                        <h2 id="price-section-title">Precio y consumo</h2>
                        <p>Registra el consumo estimado y el precio comercial.</p>
                    </div>
                </div>

                <div class="field-grid field-grid--price">
                    <div class="form-field">
                        <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> {consumptionLabel}</span>
                        <lightning-input variant="label-hidden"
                            data-field="monthlyConsumption"
                            autocomplete="off"
                            type="number"
                            label={consumptionLabel}
                            value={form.monthlyConsumption}
                            onchange={handleTextChange}
                            min="0"
                            step="0.01"
                            required>
                        </lightning-input>
                    </div>

                    <div class="native-field slds-form-element">
                        <label class="native-field__label" for="price-input">
                            <span aria-hidden="true">*</span> Precio
                        </label>
                        <div class="slds-form-element__control">
                            <input
                                id="price-input"
                                autocomplete="off"
                                class="slds-input native-price"
                                data-field="price"
                                type="text"
                                inputmode="decimal"
                                value={priceDisplay}
                                pattern="[0-9,]*([.][0-9]{1,2})?"
                                title="Ingresa un precio con punto decimal y hasta dos decimales."
                                oninput={handlePriceInput}
                                onchange={handlePriceInput}
                                onkeydown={handlePriceKeyDown}
                                onpaste={handlePricePaste}
                                onblur={handlePriceBlur}
                                required />
                        </div>
                    </div>

                    <div class="form-field">
                        <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Unidad</span>
                        <lightning-combobox variant="label-hidden"
                            name="unit"
                            label="Unidad"
                            value={form.unit}
                            options={unitOptions}
                            placeholder="Selecciona una unidad"
                            onchange={handleFieldChange}
                            required>
                        </lightning-combobox>
                    </div>

                </div>
            </section>

            <section class="form-card form-card--supplier" aria-labelledby="supplier-section-title">
                <div class="section-heading">
                    <span class="section-number">4</span>
                    <div>
                        <h2 id="supplier-section-title">Proveedor y origen</h2>
                        <p>Información del proveedor y lugar de fabricación.</p>
                    </div>
                </div>

                <div class={supplierGridClass}>
                    <div class="native-field">
                        <label class="native-field__label" for="supplier-select">
                            <span aria-hidden="true">*</span> Proveedor
                        </label>
                        <select
                            id="supplier-select"
                            autocomplete="off"
                            class="native-select"
                            name="supplier"
                            onchange={handleSupplierChange}
                            disabled={isSupplierDisabled}
                            required>
                            <option value="">Selecciona un proveedor</option>
                            <template for:each={supplierOptions} for:item="option">
                                <option key={option.value} value={option.value}>{option.label}</option>
                            </template>
                        </select>
                    </div>

                    <template lwc:if={showOtherSupplierInput}>
                        <div class="form-field">
                            <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Nombre del proveedor</span>
                            <lightning-input variant="label-hidden"
                                data-field="otherSupplier"
                                autocomplete="off"
                                label="Nombre del proveedor"
                                value={form.otherSupplier}
                                placeholder="Escribe el nombre del proveedor"
                                onchange={handleTextChange}
                                maxlength="255"
                                required>
                            </lightning-input>
                        </div>
                    </template>

                    <template lwc:if={showFactoryLocationFields}>
                        <div class="lookup">
                            <div class="form-field">
                                <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Lugar de fabricación (Estado)</span>
                                <lightning-input variant="label-hidden"
                                    data-location="factoryState"
                                    type="search"
                                    label="Lugar de fabricación (Estado)"
                                    value={factoryStateSearch}
                                    placeholder="Escribe para buscar"
                                    onchange={handleFactoryStateSearch}
                                    onfocus={handleFactoryStateFocus}
                                    onblur={handleLookupBlur}
                                    autocomplete="off"
                                    disabled={isLocationDisabled}
                                    required>
                                </lightning-input>
                            </div>
                            <template lwc:if={showFactoryStateResults}>
                                <div class="lookup__menu" role="listbox" aria-label="Estados de fabricación disponibles">
                                    <template for:each={factoryStateMatches} for:item="option">
                                        <button
                                            key={option.value}
                                            type="button"
                                            class="lookup__option"
                                            data-value={option.value}
                                            onmousedown={handleLookupOptionMouseDown}
                                            onclick={selectFactoryState}
                                            role="option">
                                            {option.label}
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template lwc:if={showFactoryLocationFields}>
                        <div class="lookup">
                            <div class="form-field">
                                <span class="native-field__label" aria-hidden="true"><span aria-hidden="true">*</span> Lugar de fabricación (Ciudad)</span>
                                <lightning-input variant="label-hidden"
                                    data-location="factoryCity"
                                    type="search"
                                    label="Lugar de fabricación (Ciudad)"
                                    value={factoryCitySearch}
                                    placeholder="Escribe para filtrar"
                                    onchange={handleFactoryCitySearch}
                                    onfocus={handleFactoryCityFocus}
                                    onblur={handleLookupBlur}
                                    autocomplete="off"
                                    disabled={isFactoryCityDisabled}
                                    required>
                                </lightning-input>
                            </div>
                            <template lwc:if={showFactoryCityResults}>
                                <div class="lookup__menu" role="listbox" aria-label="Ciudades de fabricación disponibles">
                                    <template for:each={factoryCityMatches} for:item="option">
                                        <button
                                            key={option.value}
                                            type="button"
                                            class="lookup__option"
                                            data-value={option.value}
                                            onmousedown={handleLookupOptionMouseDown}
                                            onclick={selectFactoryCity}
                                            role="option">
                                            {option.label}
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                <div class="form-actions">
                    <button type="submit" class="confirm-button" disabled={isSaving}>Confirmar</button>
                </div>
            </section>
        </form>

        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text="Registrando mapeo" size="small"></lightning-spinner>
        </template>
    </div>
</template>
