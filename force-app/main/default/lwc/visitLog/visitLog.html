<template>

    <section class="visit-log-panel">

        <header class="visit-log-header">
            <div class="visit-log-header-icon">
                <lightning-icon icon-name="utility:knowledge_base" size="medium" variant="inverse"
                    alternative-text="Bitácora">
                </lightning-icon>
            </div>

            <div class="visit-log-header-copy">
                <h2>Bitácora de visitas y sugerencias</h2>
                <p>Consulta la frecuencia, el historial y las sugerencias de visitas de tus clientes.</p>
            </div>
        </header>

        <div class="visit-log-content">

            <template lwc:if={showVisitControls}>
                <section class="visit-log-kpis" aria-label="Resumen anual de visitas">
                    <article class="visit-log-kpi-card">
                        <div class="visit-log-kpi-icon visit-log-kpi-icon-green">
                            <lightning-icon icon-name="utility:user" size="small"
                                alternative-text="Sucursales asignados">
                            </lightning-icon>
                        </div>

                        <div class="visit-log-kpi-copy">
                            <span>Sucursales asignados</span>
                            <strong>{summaryMetrics.assignedBranches}</strong>
                        </div>
                    </article>

                    <article class="visit-log-kpi-card">
                        <div class="visit-log-kpi-icon visit-log-kpi-icon-green">
                            <lightning-icon icon-name="utility:success" size="small"
                                alternative-text="Visitas realizadas en el actual año">
                            </lightning-icon>
                        </div>

                        <div class="visit-log-kpi-copy">
                            <span>Visitas realizadas en el actual año</span>
                            <strong>{summaryMetrics.completedVisits}</strong>
                        </div>
                    </article>

                    <article class="visit-log-kpi-card">
                        <div class="visit-log-kpi-icon visit-log-kpi-icon-blue">
                            <span class="visit-log-compliance-ring" style={complianceRingStyle} aria-hidden="true">
                                <i></i>
                            </span>
                        </div>

                        <div class="visit-log-kpi-copy">
                            <span>Cumplimiento anual</span>
                            <strong>{summaryMetrics.annualCompliance}%</strong>
                        </div>
                    </article>

                    <article class="visit-log-kpi-card">
                        <div class="visit-log-kpi-icon visit-log-kpi-icon-blue">
                            <lightning-icon icon-name="utility:event" size="small"
                                alternative-text="Visitas programadas">
                            </lightning-icon>
                        </div>

                        <div class="visit-log-kpi-copy">
                            <span>Visitas programadas</span>
                            <strong>{summaryMetrics.scheduledVisits}</strong>
                        </div>
                    </article>
                </section>

                <section class="visit-log-next-card" aria-label="Próxima visita programada">
                    <h3>Próxima visita programada</h3>

                    <div class="visit-log-next-content">
                        <div class="visit-log-next-summary">
                            <span class="visit-log-summary-item">
                                <lightning-icon icon-name="utility:location" size="x-small"
                                    alternative-text="Ubicación">
                                </lightning-icon>
                                <span>{selectedScheduledVisit.location}</span>
                            </span>

                            <span class="visit-log-summary-item">
                                <lightning-icon icon-name="utility:event" size="x-small" alternative-text="Fecha">
                                </lightning-icon>
                                <span>{selectedScheduledVisit.dateLabel}</span>
                            </span>

                            <span class="visit-log-summary-item">
                                <lightning-icon icon-name="utility:user" size="x-small" alternative-text="Ejecutivo">
                                </lightning-icon>
                                <span>{selectedScheduledVisit.executiveName}</span>
                            </span>
                        </div>

                        <div class="visit-log-next-actions">
                            <lightning-combobox name="scheduled-visit" label="Próximas visitas" variant="label-hidden"
                                placeholder="Próximas visitas" value={selectedScheduledActivityId}
                                options={scheduledVisitOptions} disabled={scheduledVisitSelectDisabled}
                                onchange={handleScheduledVisitChange}>
                            </lightning-combobox>

                            <button type="button" class="visit-log-suggestions-button"
                                disabled={suggestionsButtonDisabled} onclick={handleShowSuggestions}>
                                <lightning-icon icon-name="utility:refresh" size="xx-small" variant="inverse"
                                    alternative-text="Sugerencias">
                                </lightning-icon>
                                <span>Sugerencias</span>
                            </button>
                        </div>
                    </div>
                </section>
            </template>

            <section class="visit-log-table-card" aria-label="Control anual por sucursal">

                <div class="visit-log-table-heading">
                    <h3>{tableTitle}</h3>

                    <template lwc:if={isBitacoraView}>
                        <div class="visit-log-legend" aria-label="Conceptos de visitas">
                            <span>
                                <i class="visit-log-legend-marker visit-log-marker-completed"></i>
                                Realizada
                            </span>

                            <span>
                                <i class="visit-log-legend-marker visit-log-marker-scheduled"></i>
                                Programada
                            </span>

                            <span>
                                <i class="visit-log-legend-marker visit-log-marker-call"></i>
                                Llamada
                            </span>

                            <span>
                                <i class="visit-log-legend-marker visit-log-marker-extraordinary"></i>
                                Visitas urgentes
                            </span>

                            <span>
                                <i class="visit-log-legend-marker visit-log-marker-suggested"></i>
                                Sugerida
                            </span>
                        </div>
                    </template>
                </div>

                <template lwc:if={isLoading}>
                    <div class="visit-log-state-panel">
                        <lightning-spinner alternative-text="Cargando bitácora de visitas" size="medium">
                        </lightning-spinner>
                        <p>Cargando sucursales y visitas del año actual...</p>
                    </div>
                </template>

                <template lwc:elseif={errorMessage}>
                    <div class="visit-log-state-panel visit-log-state-error">
                        <lightning-icon icon-name="utility:error" size="small" alternative-text="Error">
                        </lightning-icon>
                        <p>{errorMessage}</p>
                        <button type="button" onclick={handleRetry}>Reintentar</button>
                    </div>
                </template>

                <template lwc:elseif={hasRows}>
                    <div class="visit-log-table-toolbar">
                        <template lwc:if={isSuggestionView}>
                            <button type="button" class="visit-log-clear-suggestions" onclick={handleClearSuggestions}>
                                <lightning-icon icon-name="utility:close" size="xx-small"
                                    alternative-text="Borrar sugerencias">
                                </lightning-icon>
                                <span>Borrar sugerencias</span>
                            </button>
                        </template>

                        <div class="visit-log-table-filters">
                            <div class="visit-log-filter-control">
                                <label for="visit-log-state-filter">Ubicación</label>
                                <div class="visit-log-select-control">
                                    <select id="visit-log-state-filter" data-filter="state" value={stateFilter}
                                        disabled={isSuggestionView} onchange={handleStateFilterChange}>
                                        <template for:each={stateFilterOptions} for:item="option">
                                            <option key={option.value} value={option.value}>{option.label}</option>
                                        </template>
                                    </select>
                                    <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="">
                                    </lightning-icon>
                                </div>
                            </div>

                            <div class="visit-log-filter-control">
                                <label for="visit-log-progress-filter">Avance</label>
                                <div class="visit-log-select-control">
                                    <select id="visit-log-progress-filter" data-filter="progress"
                                        value={progressFilter} onchange={handleProgressFilterChange}>
                                        <template for:each={progressFilterOptions} for:item="option">
                                            <option key={option.value} value={option.value}>{option.label}</option>
                                        </template>
                                    </select>
                                    <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="">
                                    </lightning-icon>
                                </div>
                            </div>

                            <div class="visit-log-filter-control">
                                <label for="visit-log-status-filter">Status</label>
                                <div class="visit-log-select-control">
                                    <select id="visit-log-status-filter" data-filter="status" value={statusFilter}
                                        onchange={handleStatusFilterChange}>
                                        <template for:each={statusFilterOptions} for:item="option">
                                            <option key={option.value} value={option.value}>{option.label}</option>
                                        </template>
                                    </select>
                                    <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="">
                                    </lightning-icon>
                                </div>
                            </div>

                            <div class="visit-log-activity-filter" onfocusout={handleActivityFilterBlur}>
                                <span class="visit-log-filter-label">Actividad</span>

                                <button type="button" class={activityFilterButtonClass} aria-haspopup="listbox"
                                    aria-expanded={isActivityFilterOpen} onclick={handleToggleActivityFilter}>
                                    <span>{activityFilterLabel}</span>
                                    <lightning-icon icon-name="utility:down" size="xx-small"
                                        alternative-text="Abrir filtro de actividad">
                                    </lightning-icon>
                                </button>

                                <template lwc:if={isActivityFilterOpen}>
                                    <div class="visit-log-activity-filter-options" role="listbox"
                                        aria-label="Filtrar por actividad" aria-multiselectable="true">
                                        <template for:each={activityFilterOptions} for:item="option">
                                            <label key={option.value} class="visit-log-activity-filter-option">
                                                <input type="checkbox" value={option.value} checked={option.checked}
                                                    onchange={handleActivityFilterChange}>
                                                <i class={option.markerClass}></i>
                                                <span>{option.label}</span>
                                            </label>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="visit-log-search-filter">
                            <label for="visit-log-search">Buscar en la tabla</label>
                            <div class="visit-log-search-control">
                                <lightning-icon icon-name="utility:search" size="xx-small" alternative-text="">
                                </lightning-icon>
                                <input id="visit-log-search" type="search"
                                    placeholder="Buscar sucursal, cliente, ubicación o estado..." value={searchTerm}
                                    oninput={handleSearch}>
                            </div>
                        </div>
                    </div>

                    <template lwc:if={hasVisibleRows}>
                        <div class="visit-log-table-scroll" style={tableViewportStyle}>
                            <c-visit-log-datatable key-field="id" data={rows} columns={columns} sorted-by={sortedBy}
                                sorted-direction={sortDirection} onsort={handleSort} hide-checkbox-column
                                column-widths-mode="fixed" wrap-text-max-lines="2"
                                onactivityselect={handleActivitySelect}>
                            </c-visit-log-datatable>
                        </div>
                    </template>

                    <template lwc:else>
                        <div class="visit-log-search-empty">
                            {emptyTableMessage}
                        </div>
                    </template>

                    <template lwc:if={hasPaginationResults}>
                        <div class="visit-log-pagination">
                            <span class="visit-log-pagination-summary">
                                {pageSummary}
                            </span>

                            <div class="visit-log-pagination-navigation">
                                <button type="button" class="visit-log-pagination-button"
                                    disabled={isPreviousPageDisabled} onclick={handlePreviousPage}>
                                    <lightning-icon icon-name="utility:chevronleft" size="xx-small"
                                        alternative-text="Anterior">
                                    </lightning-icon>
                                    Anterior
                                </button>

                                <span class="visit-log-pagination-page">
                                    {pageLabel}
                                </span>

                                <button type="button" class="visit-log-pagination-button" disabled={isNextPageDisabled}
                                    onclick={handleNextPage}>
                                    Siguiente
                                    <lightning-icon icon-name="utility:chevronright" size="xx-small"
                                        alternative-text="Siguiente">
                                    </lightning-icon>
                                </button>
                            </div>
                        </div>
                    </template>
                </template>

                <template lwc:else>
                    <div class="visit-log-state-panel visit-log-state-empty">
                        <lightning-icon icon-name="utility:info" size="small" alternative-text="Sin sucursales">
                        </lightning-icon>
                        <p>No tienes sucursales asignadas para mostrar en la bitácora.</p>
                    </div>
                </template>

            </section>

        </div>

        <template lwc:if={selectedActivityDetailId}>
            <c-visit-log-activity-modal activity-id={selectedActivityDetailId}
                onclose={handleCloseActivityDetail}>
            </c-visit-log-activity-modal>
        </template>

    </section>

</template>
